function viewFinance(){
  const on = activePotentials();
  const Sx = on.length ? buildScenario() : S;

  const real = PROJECTS.filter(p=>p.status==='confirmed');
  const mixedCurrency = real.some(p=>(p.currency||'USD')!=='USD');
  const totRevenue = real.reduce((n,p)=>n+toUSD(p.revenue||0, p.currency||'USD'),0);
  const totCost = real.reduce((n,p)=>{ const f=projectFinance(p.id,S); return n+toUSD(f.cost,f.currency); },0);
  const totMargin = totRevenue-totCost;
  const totOutsource = Z.filter(z=>z.outsource).reduce((n,z)=>n+z.outsource.cost,0);
  const overBudget = real.map(p=>projectFinance(p.id,S)).filter(f=>!f.ok);

  const r = range(), inRange = workdays(new Date(Math.max(TODAY,r.start)), r.end);
  const capReal = TEAM.length*inRange;
  const busyReal = TEAM.reduce((n,m)=>n+[...S.occ[m.id].keys()].filter(k=>D(k)>=r.start&&D(k)<=r.end).length,0);
  const busyScn  = TEAM.reduce((n,m)=>n+[...Sx.occ[m.id].keys()].filter(k=>D(k)>=r.start&&D(k)<=r.end).length,0);

  return `
  <div class="head"><h1>Finance</h1></div>

  <div class="kpis">
    <div class="kpi"><div class="l">Contracted revenue</div><div class="v">${money(totRevenue)}</div><div class="f">${real.length} confirmed projects${mixedCurrency?' · AED converted':''}</div></div>
    <div class="kpi"><div class="l">Cost to finish everything</div><div class="v">${money(totCost)}</div><div class="f">${money(totOutsource)} of it outsourced</div></div>
    <div class="kpi ${totMargin<0?'warn':''}"><div class="l">Projected margin</div><div class="v">${money(totMargin)}</div><div class="f">${mixedCurrency?`≈ USD, AED @ ${FX.AED}`:'across all confirmed work'}</div></div>
    <div class="kpi ${overBudget.length?'warn':''}"><div class="l">Over budget</div><div class="v">${overBudget.length}</div>
      <div class="f">${overBudget.length? overBudget.map(f=>{const pj=real.find(p=>projectFinance(p.id,S)===f); return pj?pj.name:'';}).filter(Boolean).join(', ') : 'none'}</div></div>
    <div class="kpi"><div class="l">Studio utilisation</div><div class="v">${Math.round(busyReal/capReal*100)}%</div>
      <div class="f">${on.length? `${Math.round(busyScn/capReal*100)}% with potential projects on` : `next ${r.weeks} weeks`}</div></div>
  </div>

  <div class="grid2">
    <section class="card">
      <div class="card-h"><h2>Cost vs revenue by project</h2><span class="hint">green = covered · orange = short</span></div>
      <div class="card-b">
        ${real.map(p=>{
          const f=projectFinance(p.id,S), pct=f.revenue? Math.min(100,Math.round(f.cost/f.revenue*100)):0;
          return `<div style="margin-bottom:18px">
            <div style="display:flex;justify-content:space-between;font-size:15px;margin-bottom:6px">
              <span>${esc(p.name)}${f.currency!=='USD'?` <span class="muted" style="font-size:11.5px">(${f.currency})</span>`:''}</span>
              <span class="money">${money(f.cost,f.currency)} / ${money(f.revenue,f.currency)}</span></div>
            <div style="height:10px;border-radius:6px;background:var(--line-2);overflow:hidden">
              <div style="height:100%;width:${pct}%;background:${f.ok?'var(--appr)':'var(--pause)'}"></div></div>
            <div class="muted" style="font-size:12px;margin-top:5px">margin ${money(f.margin,f.currency)}</div>
          </div>`;
        }).join('')}
      </div>
    </section>

    <section class="card">
      <div class="card-h"><h2>Team</h2><span class="hint">add, edit or remove designers and architects</span></div>
      <div class="card-b">
        ${TEAM.map(m=>{
          const busy = Z.some(z=>z.a===m.id);
          return `<div style="display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid var(--line-2)">
          <input value="${esc(m.name)}" data-team-name="${m.id}" style="flex:1;min-width:110px;border:1px solid var(--line);background:var(--line-2);border-radius:9px;padding:8px 10px;font-size:13.5px">
          <select data-team-role="${m.id}" style="border:1px solid var(--line);background:var(--line-2);border-radius:9px;padding:8px 10px;font-size:13px">
            <option value="viz" ${m.team==='viz'?'selected':''}>Designer</option>
            <option value="wd" ${m.team==='wd'?'selected':''}>Architect</option>
          </select>
          <select data-team-type="${m.id}" style="border:1px solid var(--line);background:var(--line-2);border-radius:9px;padding:8px 10px;font-size:13px">
            <option value="staff" ${m.type!=='freelance'?'selected':''}>In-house</option>
            <option value="freelance" ${m.type==='freelance'?'selected':''}>Outsource</option>
          </select>
          ${m.type==='freelance'
            ? '<span class="muted" style="font-size:12px;min-width:130px">cost set per project</span>'
            : `<input type="number" min="0" step="50" value="${m.rate}" data-rate="${m.id}" aria-label="Monthly rate" style="width:100px;border:1px solid var(--line);background:var(--line-2);border-radius:9px;padding:8px 10px;font-size:13.5px">`}
          <button class="rm" data-team-rm="${m.id}" ${busy?'disabled title="Reassign their zones first"':''} aria-label="Remove">×</button>
        </div>`;
        }).join('')}
        <div style="display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:16px">
          <input id="newTeamName" placeholder="Name" style="flex:1;min-width:110px;border:1px solid var(--line);background:var(--line-2);border-radius:9px;padding:8px 10px;font-size:13.5px">
          <select id="newTeamRole" style="border:1px solid var(--line);background:var(--line-2);border-radius:9px;padding:8px 10px;font-size:13px">
            <option value="viz">Designer</option><option value="wd">Architect</option>
          </select>
          <select id="newTeamType" style="border:1px solid var(--line);background:var(--line-2);border-radius:9px;padding:8px 10px;font-size:13px">
            <option value="staff">In-house</option><option value="freelance">Outsource</option>
          </select>
          <input id="newTeamRate" type="number" min="0" step="50" placeholder="Rate/month" style="width:100px;border:1px solid var(--line);background:var(--line-2);border-radius:9px;padding:8px 10px;font-size:13.5px">
          <button class="btn" data-team-add>+ Add</button>
        </div>
        <div class="muted" style="font-size:12px;margin-top:12px">In-house daily cost = monthly salary ÷ working days in that calendar month. Outsource cost is set per zone (Delivery field), so it can differ project to project — even interior vs exterior on the same project.</div>
      </div>
    </section>
  </div>

  <section class="card" style="margin-top:16px">
    <div class="card-h"><h2>Potential projects — scenario switches</h2><span class="hint">turn on to see the effect on capacity and margin before committing</span></div>
    <div class="card-b">
      ${state.potentials.map(pp=>{
        const sc = scenarios(pp.effort, pp.team)[0];
        const cost = sc? Object.entries(sc.r.by).reduce((n,[id,days])=>{
          let c=0; days.forEach(d=>c+=dailyRate(id, ym(d))); return n+c;
        },0) : 0;
        return `<div class="toggle">
          <button class="switch" role="switch" aria-pressed="${pp.on}" data-pot-toggle="${pp.id}"><i></i></button>
          <div style="flex:1"><div class="nm">${esc(pp.name)}</div>
            <div class="sub">${pp.effort} ${DISC[pp.team].role.toLowerCase()}-days · ${DISC[pp.team].roles} · revenue ${money(pp.revenue)}</div></div>
          <div style="text-align:right">
            <div>${sc? fmt(D(sc.r.start))+' → '+fmt(D(sc.r.finish)) : 'no fit'}</div>
            <div class="muted" style="font-size:12px">cost ≈ ${money(cost)} · margin ≈ ${money(pp.revenue-cost)}</div>
          </div>
        </div>`;
      }).join('')}
      ${on.length? `<div class="banner ${busyScn/capReal>1?'warn':'ok'}" style="margin-top:16px">
        With ${on.map(p=>p.name).join(' + ')} switched on: utilisation goes from ${Math.round(busyReal/capReal*100)}% to
        ${Math.round(busyScn/capReal*100)}%${busyScn>capReal? `, ${busyScn-capReal} days over team capacity — outsourcing or a hire will be needed` : ', still inside team capacity'}.
      </div>` : `<div class="note" style="margin-top:16px">All switches off — figures above show only confirmed work.</div>`}
    </div>
  </section>`;
}

function lineRows(c, key, label){
  const items = c[key];
  return `<div class="calc-sec"><div class="calc-sec-h">${label}<span class="muted">${items.reduce((n,x)=>n+x.eff,0)}d</span></div>
    ${items.map((x,i)=>`<div class="calc-row2">
      <input value="${esc(x.name)}" data-calc="${c.id}" data-f="${key}" data-i="${i}" data-p="name">
      <input type="number" min="0" value="${x.eff}" data-calc="${c.id}" data-f="${key}" data-i="${i}" data-p="eff">
      <div class="num">${x.eff}d</div>
      <button class="rm" data-calc-rm="${c.id}" data-rf="${key}" data-i="${i}" aria-label="Remove">×</button>
    </div>`).join('') || '<div class="muted" style="font-size:12.5px;margin-bottom:6px">No line items.</div>'}
    <button class="add" data-calc-add="${c.id}" data-af="${key}">+ add line</button>

}

function uniqueProjectId(base){
  let id=base, n=2;
  while(PROJECTS.some(p=>p.id===id)){ id=base+'-'+n; n++; }
  return id;
}
function commitCalcToProduction(c){
  const id = uniqueProjectId(c.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'project');
  const prio = Math.max(0,...PROJECTS.map(p=>p.prio))+1;
  PROJECTS.push({id, name:c.name, prio, status:'confirmed', revenue:c.budget||0, currency:c.currency||'USD', payments:[]});
  dbSaveProject(PROJECTS[PROJECTS.length-1]);

  const before = Z.length;
  c.floors.forEach(f=>{
    for(let n=1; n<=f.rooms; n++){
      zone({p:id, d:'viz', floor:f.name, n, name:'Room '+String(n).padStart(2,'0'), effort:f.eff, status:'pending', a:f.executor||null, outsource:outsourceFor(f.executor)});
    }
  });
  if(c.ext && c.ext.zones>0){
    const perZone = c.outsourceExt ? Math.round(c.outsourceExt.cost / c.ext.zones) : null;
    for(let n=1; n<=c.ext.zones; n++){
      zone({p:id, d:'viz', floor:'Exterior', n, name: c.ext.zones>1? 'Exterior '+n : 'Exterior', effort:c.ext.eff,
        status:'pending', a: c.outsourceExt? null : (c.ext.executor||null),
        outsource: perZone!=null? {cost:perZone} : outsourceFor(c.ext.executor)});
    }
  }
  c.dwgInt.forEach((x,i)=>zone({p:id, d:'wd', floor:x.name, n:i+1, name:x.name, effort:x.eff, status:'pending', a:c.archExecutor||null, outsource:outsourceFor(c.archExecutor)}));
  c.dwgExt.forEach((x,i)=>zone({p:id, d:'wd', floor:x.name, n:i+1, name:x.name, effort:x.eff, status:'pending', a:c.archExecutor||null, outsource:outsourceFor(c.archExecutor)}));
  const added = Z.slice(before);
  added.forEach(dbSaveZone);

  c.committedProjectId = id;
  S = build();
  state.tab='production'; state.project=id; state.disc='viz';
  render(); window.scrollTo({top:0});
  toast(`${c.name} is in Production · ${added.length} zones created`);
}

              <div style="border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 9px;font-size:12.5px;color:var(--ink-2)">${fmt(revEnd)}${revProjected?' *':''}</div></div>
          </div>
          ${revProjected?`<div class="muted" style="font-size:10.5px;margin-top:8px">* projected from the start date — moving it later pushes anything waiting on this room too</div>`:`<div class="muted" style="font-size:10.5px;margin-top:8px">Currently scheduled ${fmt(revStart)} – ${fmt(revEnd)}</div>`}
          <div style="margin-top:12px"><div class="muted" style="font-size:10.5px;margin-bottom:4px">What needs fixing</div>
            <textarea data-revnote rows="2" placeholder="e.g. lighter wood tone, move the pendant light left" style="width:100%;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 9px;font:inherit;font-size:12.5px;resize:vertical">${esc(z.revisionNote||'')}</textarea></div>
        </div>`;
      })():''}
    </div>

    <div class="field"><div class="fl">${dc.role}</div>
      <select data-assign><option value="">Not assigned</option>
      ${TEAM.filter(m=>m.team===z.d).map(m=>`<option value="${m.id}" ${z.a===m.id?'selected':''}>${m.name}${m.type==='freelance'?' (outsource)':''}</option>`).join('')}</select></div>

    <div class="field"><div class="fl">Delivery</div>
      ${isFreelance(z.a) ? `
        <div class="muted" style="font-size:12.5px;margin-bottom:9px">${esc(person(z.a).name)} is an outsource ${dc.role.toLowerCase()} — cost is set per project, and can differ for interior and exterior work.</div>
        <div class="fl">Flat fee, USD</div>
        <input type="number" min="0" step="10" value="${z.outsource?z.outsource.cost:0}" data-outfee="${z.id}" style="width:100%;border:1px solid var(--line);background:var(--line-2);border-radius:11px;padding:10px 12px">
      ` : `
        <div class="stbtns">
          <button data-outsource="off" aria-pressed="${!z.outsource}">In-house</button>
          <button data-outsource="on"  aria-pressed="${!!z.outsource}" ${!z.a?'disabled':''}>Outsourced</button>
        </div>
        ${z.outsource? `<div style="margin-top:10px"><div class="fl">Flat fee, USD</div>
          <input type="number" min="0" step="50" value="${z.outsource.cost}" data-outfee="${z.id}" style="width:100%;border:1px solid var(--line);background:var(--line-2);border-radius:11px;padding:10px 12px">
        </div>` : z.a? `<div class="muted" style="font-size:12.5px;margin-top:8px">
          In-house ≈ ${money(zoneCostEstimate({...z,outsource:null,status:'pending'}))} at ${person(z.a).name}'s current rate.</div>` : ''}
      `}
    </div>

    <div class="note">${
      z.status==='approved' ? '<b>Approved.</b> No more work in the calendar.' :
      z.status==='paused'   ? `<b>On hold.</b> ${z.effort} days wait outside the calendar.` :
      s && s.s ? `<b>${active(z)} days in the calendar</b> · ${fmt(D(s.s))} – ${fmt(D(s.e))}${s.days.length<workdays(D(s.s),D(s.e))?` · with breaks for other work`:''}` :
      z.a ? '<b>Waiting.</b> Starts after the previous stage is approved.' : '<b>No one assigned.</b> Pick a person above.'
    }${z.after?`<br>Starts ${z.after.lag} days after ${esc(z.after.floor)} 3D is finished.`:''}</div>

    <button class="btn ghost" data-del style="margin-top:20px;width:100%">Remove ${dc.unit1}</button>`);
}
/* деталізація клітинки Team Load: Project → discipline → floor/zone → assignee → залишок */
function loadDetailRows(personId, projectFilterId, per){
  return Z.filter(z=>z.a===personId && proj(z.p).status==='confirmed' && (!projectFilterId || z.p===projectFilterId) && active(z)>0)
    .map(z=>{ const it=S.byId.get(z.id); return {z, it}; })
    .sort((a,b)=>proj(a.z.p).prio-proj(b.z.p).prio || (a.it.s? D(a.it.s)-D(b.it.s) : 1));
}
function openLoadDetail(personId, projectFilterId){
  const m = person(personId), per = range();
  const rows = loadDetailRows(personId, projectFilterId, per);
  const title = projectFilterId ? `${m.name} · ${proj(projectFilterId).name}` : `${m.name} — all confirmed projects`;
  drawer(`<button class="x" data-close aria-label="Close">×</button>
    <div class="muted" style="font-size:13px">${ROLE_LABEL[m.team]||m.team}${m.type==='freelance'?' · Outsource':''}</div>
    <h3>${esc(title)}</h3>
    <p class="muted" style="font-size:12.5px;margin:6px 0 16px">How this person's remaining effort breaks down — project → discipline → zone → status.</p>
    ${rows.length? rows.map(({z,it})=>{
      const dv=DISC[z.d], st=STATUS[z.status];
      const when = it && it.s ? (D(it.s)>=per.start && D(it.e)<=per.end ? `${fmt(D(it.s))} – ${fmt(D(it.e))}` :
        D(it.s)>per.end ? `starts after ${fmt(per.end)}` : `${fmt(D(it.s))} – ${fmt(D(it.e))} (spills past ${fmt(per.end)})`)
        : 'not yet scheduled';
      return `<div style="padding:12px 0;border-bottom:1px solid var(--line-2);cursor:pointer" data-open-zone="${z.id}">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">
          <span style="font-size:14px">${esc(proj(z.p).name)} <span class="muted" style="font-size:12px">· ${dv.name} · ${esc(z.floor||'')}</span></span>
          <span style="font-weight:500">${active(z)} d</span>
        </div>
        <div style="margin-top:3px;font-size:12.5px;color:var(--ink-2)">${esc(z.name)}</div>
        <div style="margin-top:4px;display:flex;gap:8px;align-items:center;font-size:11.5px">
          <span style="background:${st.col};color:${st.ink};border-radius:20px;padding:2px 9px">${st.lab}</span>
          <span class="muted">${when}</span>
        </div>
      </div>`;
    }).join('') : '<div class="muted" style="padding:14px 0">No remaining effort here.</div>'}
    ${projectFilterId? `<button class="pill" data-goto="${projectFilterId}|${rows[0]?rows[0].z.d:'viz'}" style="margin-top:16px">Open in Project Production →</button>` : ''}
  `);
}
function drawer(h){ const d=document.getElementById('drawer'); d.innerHTML=h; d.dataset.open='true'; document.getElementById('scrim').dataset.open='true'; }
function closeDrawer(){ state.selZone=null; document.getElementById('drawer').dataset.open='false'; document.getElementById('scrim').dataset.open='false'; render(); }
let TT; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.dataset.show='true'; clearTimeout(TT); TT=setTimeout(()=>t.dataset.show='false',2600); }

/* ======================================================================
   РЕНДЕР
   ====================================================================== */
function render(){
  const r=range();
  document.getElementById('range').innerHTML =
    `<button data-shift="-1" aria-label="Previous week">‹</button>${fmt(r.start)} — ${fmt(r.end)}<button data-shift="1" aria-label="Next week">›</button>`;
  document.getElementById('tabs').innerHTML = [['production','Project calculator'],['gantt','Production plan'],['load','Studio load'],['potential','Potential project'],['calendar','Resource calendar'],['finance','Finance'],['all','All projects']]
    .map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${state.tab===k}">${l}</button>`).join('');
  document.getElementById('main').innerHTML =
    state.tab==='load' ? viewLoad() : state.tab==='potential' ? viewPotential() : state.tab==='calendar' ? viewCalendar()
    : state.tab==='finance' ? viewFinance() : state.tab==='all' ? viewAllProjects() : state.tab==='gantt' ? viewGanttPlan() : viewProduction();
}

/* ======================================================================
   ПОДІЇ
   ====================================================================== */
function curZone(){ return Z.find(x=>x.id===state.selZone) }
function changed(msg){ dbSaveZone(curZone()); S=build(); render(); if(state.selZone) openZone(state.selZone); if(msg) toast(msg); }

document.addEventListener('click', e=>{
  const el=s=>e.target.closest(s); let n;
  if(el('[data-close]') || e.target.id==='scrim'){ closeDrawer(); return; }
  if(n=el('[data-tab]')){ state.tab=n.dataset.tab; render(); return; }
  if(n=el('[data-shift]')){ state.offset+= +n.dataset.shift; render(); return; }
  if(n=el('[data-disc]')){
    state.disc=n.dataset.disc;
    if(!Z.some(z=>z.p===state.project&&z.d===state.disc)){ const p=Z.find(z=>z.d===state.disc); if(p) state.project=p.p; }
    render(); return;
  }
  if(n=el('[data-studio-disc]')){ state.studioDisc=n.dataset.studioDisc; render(); return; }
  if(n=el('[data-goto]')){ const [p,d]=n.dataset.goto.split('|'); state.project=p; state.disc=d; state.tab='production'; render(); window.scrollTo({top:0}); return; }
  if(n=el('[data-cell-load]')){ const [pid,proj_]=n.dataset.cellLoad.split('|'); openLoadDetail(pid, proj_); return; }
  if(n=el('[data-person-load]')){ openLoadDetail(n.dataset.personLoad, null); return; }
  if(n=el('[data-open-zone]')){ openZone(n.dataset.openZone); return; }
  if(n=el('[data-zone]')){ openZone(n.dataset.zone); render(); openZone(n.dataset.zone); return; }
  if(n=el('[data-seq-up]')){ const i=+n.dataset.seqUp; if(i>0){ [state.seqOrder[i-1],state.seqOrder[i]]=[state.seqOrder[i],state.seqOrder[i-1]]; renderSequenceDrawer(); } return; }
  if(n=el('[data-seq-down]')){ const i=+n.dataset.seqDown; if(i<state.seqOrder.length-1){ [state.seqOrder[i+1],state.seqOrder[i]]=[state.seqOrder[i],state.seqOrder[i+1]]; renderSequenceDrawer(); } return; }
  if(n=el('[data-seq-apply]')){
    const startVal = document.getElementById('seqStartInput').value; if(!startVal) return;
    let d = D(startVal);
    state.seqOrder.forEach(id=>{
      const z = Z.find(x=>x.id===id); if(!z) return;
      z.earliest = iso(d); dbSaveZone(z);
      d = addDays(d, Math.max(1, Math.ceil(z.revEffort)));
    });
    S=build(); closeDrawer(); render();
    toast(`${state.seqOrder.length} revisions sequenced from ${fmt(D(startVal))}`);
    return;
  }
  if(n=el('[data-sequence-revisions]')){ openSequenceRevisions(n.dataset.sequenceRevisions.split('|')[0], n.dataset.sequenceRevisions.split('|')[1]); return; }
  if(n=el('[data-note-expand]')){ state.expandedNotes[n.dataset.noteExpand]=true; render(); return; }
  if(n=el('[data-note-collapse]')){ delete state.expandedNotes[n.dataset.noteCollapse]; render(); return; }
  if(n=el('[data-expand-plan]')){
    const url = n.dataset.expandPlan;
    drawer(`<button class="x" data-close aria-label="Close">×</button>
      <h3 style="margin-bottom:14px">Floor plan</h3>
      <img src="${esc(url)}" style="width:100%;border-radius:12px;border:1px solid var(--line)">
      <a href="${esc(url)}" target="_blank" rel="noopener" class="pill" style="display:inline-block;margin-top:14px;text-decoration:none">Open full size ↗</a>`);
    return;
  }
  if(n=el('[data-rooms-view]')){ state.roomsView=n.dataset.roomsView; render(); return; }
  if(n=el('[data-tbl-remove]')){
    const id=n.dataset.tblRemove, z=Z.find(x=>x.id===id); if(!z) return;
    dbDeleteZone(id); Z=Z.filter(x=>x.id!==id);
    if(state.selZone===id){ state.selZone=null; closeDrawer(); }
    S=build(); render(); toast(`${z.name} removed`); return;
  }
  if(n=el('[data-quicksetup-toggle]')){ state.quickSetupOpen=!state.quickSetupOpen; render(); return; }
  if(n=el('[data-qs-apply]')){
    const [i,pid,disc,floor] = n.dataset.qsApply.split('|');
    const rooms = Math.max(0, Math.round(+document.getElementById('qsRooms'+i).value||0));
    const days = Math.max(0.5, +document.getElementById('qsDays'+i).value||0.5);
    applyQuickSetup(pid, disc, floor, rooms, days);
    return;
  }
  if(n=el('[data-qs-addfloor]')){
    const [pid,disc] = n.dataset.qsAddfloor.split('|');
    const name = document.getElementById('qsNewFloor').value.trim();
    if(!name){ toast('Enter a floor name'); return; }
    const rooms = Math.max(1, Math.round(+document.getElementById('qsNewRooms').value||1));
    const days = Math.max(0.5, +document.getElementById('qsNewDays').value||2);
    const before = Z.length;
    for(let k=1;k<=rooms;k++){
      zone({p:pid, d:disc, floor:name, n:k, name: disc==='viz'?'Room '+String(k).padStart(2,'0'):'Package '+k, effort:days, status:'pending', a:null});
    }
    Z.slice(before).forEach(dbSaveZone);
    S=build(); render();
    toast(`${name}: ${rooms} ${DISC[disc].unit} added`); return;
  }
  if(n=el('[data-resched]')){ openRescheduleDrawer(n.dataset.resched); return; }
  if(n=el('[data-issue-resolve]')){ state.scheduleIssues=state.scheduleIssues.filter(i=>i.id!==n.dataset.issueResolve); render(); toast('Marked resolved'); return; }
  if(n=el('[data-cal-subview]')){ state.calSubview=n.dataset.calSubview; render(); return; }
  if(n=el('[data-teamcal-shift]')){
    const v=n.dataset.teamcalShift;
    state.teamCalMonthOffset = v==='0' ? 0 : (state.teamCalMonthOffset||0)+(+v);
    state.teamCalSelDay=null; render(); return;
  }
  if(n=el('[data-teamcal-day]')){ state.teamCalSelDay = n.dataset.teamcalDay; render(); return; }
  if(n=el('[data-plan-view]')){ state.planView=n.dataset.planView; render(); return; }
  if(n=el('[data-projcal-shift]')){
    const v=n.dataset.projcalShift;
    state.projCalMonthOffset = v==='0' ? 0 : (state.projCalMonthOffset||0)+(+v);
    state.projCalSelDay=null; render(); return;
  }
  if(n=el('[data-projcal-day]')){ state.projCalSelDay = n.dataset.projcalDay; render(); return; }
  if(n=el('[data-projcal-disc]')){ state.projCalDisc=n.dataset.projcalDisc; render(); return; }
  if(n=el('[data-resched-apply]')){
    const id = n.dataset.reschedApply, zz = Z.find(x=>x.id===id); if(!zz) return;
    const newStart = document.getElementById('reschedStart').value;
    if(!newStart){ toast('Pick a start date'); return; }
    const newDur = Math.max(0.5, Math.round((+document.getElementById('reschedDur').value||0.5)*2)/2);
    zz.earliest = newStart; zz.effort = newDur;
    dbSaveZone(zz); S=build(); closeDrawer(); render();
    toast(`${zz.name}: not before ${fmt(D(zz.earliest))} · ${zz.effort}d`);
    return;
  }
  if(n=el('[data-gantt-toggle]')){ const k=n.dataset.ganttToggle; state.ganttOpen[k]=!state.ganttOpen[k]; render(); return; }
  if(n=el('[data-gantt-disc]')){ state.ganttDisc=n.dataset.ganttDisc; render(); return; }
  if(n=el('[data-gantt-zoom]')){ state.ganttZoom=n.dataset.ganttZoom; render(); return; }
  if(n=el('[data-floor-toggle]')){ const k=n.dataset.floorToggle; state.openFloor[k]=!state.openFloor[k]; closeDrawer(); return; }
  if(n=el('[data-floor-open]')){ state.openFloor[n.dataset.floorOpen]=true; closeDrawer(); return; }
  if(n=el('[data-floor-team]')){ openFloorTeam(n.dataset.floorTeam); return; }
  if(n=el('[data-scope-open]')){ const [k,name]=n.dataset.scopeOpen.split('|'); openScopeDetail(k,name); return; }
  if(n=el('[data-add-scope]')){ openAddScope(n.dataset.addScope); return; }
  if(n=el('[data-save-scope]')){
    const [pid,disc,floor] = n.dataset.saveScope.split('|');
    const name = document.getElementById('scopeName').value.trim();
    if(!name){ toast('Enter a scope name'); return; }
    const rooms = Math.max(1, Math.round(+document.getElementById('scopeRooms').value||1));
    const designer = document.getElementById('scopeDesigner').value || null;
    const totalEffort = Math.max(0.5, +document.getElementById('scopeEffort').value||0.5);
    const status = document.getElementById('scopeStatus').value;
    const per = Math.round((totalEffort/rooms)*2)/2;
    const same = Z.filter(z=>z.p===pid && z.d===disc && z.floor===floor);
    const startN = Math.max(0,...same.map(z=>z.n))+1;
    const before = Z.length;
    for(let i=0;i<rooms;i++){
      zone({p:pid, d:disc, floor, n:startN+i, name: disc==='viz'?'Room '+String(startN+i).padStart(2,'0'):name+(rooms>1?' '+(i+1):''),
        effort:per, status, a:designer, scope:name, outsource:outsourceFor(designer)});
    }
    Z.slice(before).forEach(dbSaveZone);
    S=build(); closeDrawer();
    state.openFloor[`${pid}|${disc}|${floor}`]=true;
    render(); toast(`${name}: ${rooms} ${DISC[disc].unit} · ${totalEffort}d`); return;
  }
  if(n=el('[data-scope-rename]')){
    const [pid,disc,floor,name] = n.dataset.scopeRename.split('|');
    const newName = document.getElementById('scopeRename').value.trim(); if(!newName) return;
    const fz = Z.filter(z=>z.p===pid && z.d===disc && z.floor===floor);
    const g = scopesOf(fz).find(x=>x.name===name); if(!g) return;
    g.zones.forEach(z=>{ z.scope=newName; dbSaveZone(z); });
    render(); openScopeDetail(`${pid}|${disc}|${floor}`, newName);
    toast(`Renamed to ${newName}`); return;
  }
  if(n=el('[data-scope-delete]')){
    const [pid,disc,floor,name] = n.dataset.scopeDelete.split('|');
    const fz = Z.filter(z=>z.p===pid && z.d===disc && z.floor===floor);
    const g = scopesOf(fz).find(x=>x.name===name); if(!g) return;
    g.zones.forEach(z=>dbDeleteZone(z.id));
    const ids = new Set(g.zones.map(z=>z.id));
    Z = Z.filter(z=>!ids.has(z.id));
    S=build(); closeDrawer(); render(); toast(`${name} removed · ${g.zones.length} ${DISC[disc].unit}`); return;
  }
  if(n=el('[data-add]')){
    const f=n.dataset.add, same=Z.filter(z=>z.p===state.project&&z.d===state.disc&&z.floor===f);
    const tmpl=same[same.length-1]||{effort:2,a:null};
    const num=Math.max(0,...same.map(z=>z.n))+1;
    zone({p:state.project, d:state.disc, floor:f, n:num, name:state.disc==='viz'?'Room '+String(num).padStart(2,'0'):'Package '+num,
      effort:tmpl.effort, status:'pending', a:tmpl.a, outsource:outsourceFor(tmpl.a)});
    dbSaveZone(Z[Z.length-1]);
    S=build(); render(); toast(`${f}: ${DISC[state.disc].unit1} ${num} added · ${tmpl.effort}d`); return;
  }
  const z = curZone();
  if(z && (n=el('[data-set-status]'))){ z.status=n.dataset.setStatus; if(z.status==='paused'&&!z.reason) z.reason=REASONS[0]; changed(`${z.name}: ${STATUS[z.status].lab}`); return; }
  if(z && (n=el('[data-eff]'))){ z.effort=Math.max(0.5, Math.round((z.effort+ +n.dataset.eff)*2)/2); changed(`${z.name}: ${z.effort} days`); return; }
  if(z && (n=el('[data-rev]'))){ z.revEffort=Math.max(0.0625, Math.round((z.revEffort+ +n.dataset.rev)*16)/16); changed(`${z.name}: revision ${fmtEffortHM(z.revEffort)}`); return; }
  if(z && (n=el('[data-outsource]'))){
    if(n.dataset.outsource==='on'){ if(!z.a){ toast('Assign a person first'); return; } z.outsource={cost: Math.round(z.effort*nominalRate(z.a))}; }
    else { z.outsource=null; }
    changed(`${z.name}: ${z.outsource? 'outsourced · '+money(z.outsource.cost) : 'back in-house'}`);
    return;
  }
  if(z && el('[data-del]')){ dbDeleteZone(z.id); Z=Z.filter(x=>x.id!==z.id); state.selZone=null; closeDrawer(); S=build(); render(); toast(`${z.name} removed`); return; }

  if(el('[data-simulate]')){
    state.sim.name=document.getElementById('simName').value.trim()||'New project';
    state.sim.team=document.getElementById('simTeam').value;
    state.sim.ran=true; state.sim.pick=0; render(); return;
  }
  if(n=el('[data-sim-floor-add]')){ state.sim.floors.push({name:'New floor', rooms:4, days:2}); render(); return; }
  if(n=el('[data-sim-floor-remove]')){ state.sim.floors.splice(+n.dataset.simFloorRemove,1); render(); return; }
  if(n=el('[data-pick]')){ state.sim.pick=+n.dataset.pick; render(); return; }
  if(el('[data-calrun]')){
    state.cal.name=document.getElementById('calName').value.trim()||'New project';
    state.cal.effort=Math.max(1,+document.getElementById('calEff').value||1);
    state.cal.team=document.getElementById('calTeam').value;
    render(); return;
  }
  if(n=el('[data-calmode]')){ state.cal.mode=n.dataset.calmode; render(); return; }
  if(n=el('[data-pot-toggle]')){
    const pp=state.potentials.find(x=>x.id===n.dataset.potToggle); if(!pp) return;
    pp.on=!pp.on; dbSavePotential(pp); render(); return;
  }
  if(n=el('[data-assign-cal]')){
    const id=n.dataset.assignCal, c=state.cal;
    const p = c.mode==='block'? continuousPlan(id,c.effort) : splitPlan(id,c.effort);
    if(!p){ toast('Not enough free capacity for this person'); return; }
    const pid=c.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now()%1000;
    PROJECTS.push({id:pid, name:c.name, prio:9, status:'confirmed'});
    dbSaveProject(PROJECTS[PROJECTS.length-1]);
    p.segs.forEach((sg,i)=>zone({p:pid, d:c.team, floor:p.segs.length>1?`Period ${i+1}`:'Assignment', n:1,
      name:`${person(id).name} · ${workdays(D(sg.s),D(sg.e))}d`, effort:workdays(D(sg.s),D(sg.e)), status:'pending', a:id, earliest:sg.s}));
    Z.slice(-p.segs.length).forEach(dbSaveZone);
    S=build(); state.project=pid; state.disc=c.team; state.tab='production'; render(); window.scrollTo({top:0});
    toast(`${c.name} → ${person(id).name} · finish ${fmt(D(p.finish))}`);
    return;
  }
  if(n=el('[data-calc-add]')){
    const c=CALC.find(x=>x.id===n.dataset.calcAdd); const f=n.dataset.af;
    if(f==='floors') c.floors.push({name:'New floor', rooms:1, eff:2, executor:null});
    else c[f].push({name:'New line', eff:2});
    render(); return;
  }
  if(n=el('[data-calc-rm]')){
    const c=CALC.find(x=>x.id===n.dataset.calcRm); c[n.dataset.rf].splice(+n.dataset.i,1); render(); return;
  }
  if(n=el('[data-calc-addext]')){
    const c=CALC.find(x=>x.id===n.dataset.calcAddext); c.ext={zones:1, eff:7, executor:null}; render(); return;
  }
  if(n=el('[data-calc-rmext]')){
    const c=CALC.find(x=>x.id===n.dataset.calcRmext); c.ext=null; c.outsourceExt=null; render(); return;
  }
  if(n=el('[data-calc-out]')){
    const c=CALC.find(x=>x.id===n.dataset.calcOut);
    if(n.dataset.v==='on'){ const base=(c.ext?c.ext.zones*c.ext.eff:0)*c.designRate; c.outsourceExt={cost:Math.round(base*1.2)||1000}; }
    else c.outsourceExt=null;
    render(); return;
  }
  if(el('[data-calc-newproj]')){
    const id='c'+Date.now()%100000;
    CALC.push({id, name:'New project', budget:0, pmFee:0, designRate:115, archRate:90, currency:'USD', archExecutor:null, committedProjectId:null,
      floors:[{name:'Ground Floor', rooms:1, eff:2, executor:null}], ext:null, outsourceExt:null, dwgInt:[{name:'Drawings', eff:5}], dwgExt:[]});
    render(); return;
  }
  if(n=el('[data-confirm-project]')){
    const p = proj(n.dataset.confirmProject);
    p.status='confirmed'; dbSaveProject(p); S=build(); render();
    toast(`${p.name} confirmed — now scheduled with the team`);
    return;
  }
  if(n=el('[data-pay-toggle]')){
    const [pid, idxStr] = n.dataset.payToggle.split('|'), i=+idxStr;
    const p = proj(pid);
    if(!p.payments || !p.payments[i]) return;
    p.payments[i].paid = !p.payments[i].paid;
    dbSaveProject(p); render();
    toast(`${p.payments[i].stage}: ${p.payments[i].paid?'marked paid':'marked unpaid'}`);
    return;
  }
  if(n=el('[data-team-rm]')){
    const id=n.dataset.teamRm;
    if(Z.some(z=>z.a===id)){ toast('Reassign their zones before removing'); return; }
    dbDeleteTeamMember(id);
    const i=TEAM.findIndex(x=>x.id===id); if(i>=0) TEAM.splice(i,1);
    render(); toast('Removed from the team'); return;
  }
  if(el('[data-team-add]')){
    const name=document.getElementById('newTeamName').value.trim();
    if(!name){ toast('Enter a name'); return; }
    const role=document.getElementById('newTeamRole').value;
    const type=document.getElementById('newTeamType').value;
    const rate= type==='staff'? Math.max(0,+document.getElementById('newTeamRate').value||0) : 0;
    const palette=['#EDC9CD','#CBD9EC','#F1DDB5','#D3E2DA','#DCD5F0','#E7C9A9','#C9E4D8'];
    const m={id:uniqueTeamId(name), name, team:role, type, rate, color:palette[TEAM.length%palette.length]};
    TEAM.push(m); dbSaveTeam(m); render(); toast(`${name} added to the team`); return;
  }
  if(n=el('[data-calc-commit]')){
    const c=CALC.find(x=>x.id===n.dataset.calcCommit); if(!c || c.committedProjectId) return;
    commitCalcToProduction(c);
    return;
  }
  if(el('[data-confirm]')){
    const sm=state.sim, totalEffort=sm.floors.reduce((n,f)=>n+f.rooms*f.days,0);
    const o=scenarios(totalEffort, sm.team)[sm.pick]; if(!o) return;
    const id=sm.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now()%1000;
    const primary = o.r.ids[0]; // при парі обох людей рушій усе одно розведе по черзі — кімнати стартують від одного найранішого дня
    PROJECTS.push({id, name:sm.name, prio:9, status:'confirmed', revenue:0, currency:'USD', payments:[]});
    dbSaveProject(PROJECTS[PROJECTS.length-1]);
    const before=Z.length;
    sm.floors.forEach(f=>{
      for(let k=1;k<=f.rooms;k++){
        zone({p:id, d:sm.team, floor:f.name, n:k, name: sm.team==='viz'?'Room '+String(k).padStart(2,'0'):'Package '+k,
          effort:f.days, status:'pending', a:primary, earliest:o.r.start});
      }
    });
    Z.slice(before).forEach(dbSaveZone);
    S=build(); state.project=id; state.disc=sm.team; state.tab='production'; state.sim.ran=false; render(); window.scrollTo({top:0});
    toast(`${sm.name} is in production · ${totalEffort}d across ${sm.floors.length} floor${sm.floors.length>1?'s':''} · forecast finish ${fmt(D(o.r.finish))}`); return;
  }
});
document.addEventListener('change', e=>{
  const t=e.target, z=curZone();
  if(t.dataset.uploadPlan!==undefined){
    const [pid, floor] = t.dataset.uploadPlan.split('|');
    const file = t.files && t.files[0]; if(!file) return;
    uploadFloorPlan(pid, floor, file);
    return;
  }
  if(t.id==='projSel'){ state.project=t.value; render(); return; }
  if(t.id==='ganttProjSel'){ state.planProject=t.value; render(); return; }
  if(t.id==='seqStartInput'){ state.seqStart=t.value||state.seqStart; return; }
  if(t.id==='teamCalPerson'){ state.teamCalPerson=t.value; state.teamCalSelDay=null; render(); return; }
  if(t.dataset.simFloorName!==undefined){ state.sim.floors[+t.dataset.simFloorName].name=t.value.trim()||'Floor'; render(); return; }
  if(t.dataset.simFloorRooms!==undefined){ state.sim.floors[+t.dataset.simFloorRooms].rooms=Math.max(1,Math.round(+t.value||1)); render(); return; }
  if(t.dataset.simFloorDays!==undefined){ state.sim.floors[+t.dataset.simFloorDays].days=Math.max(0.5,+t.value||0.5); render(); return; }
  if(t.dataset.tblRevnote!==undefined){
    const zz=Z.find(x=>x.id===t.dataset.tblRevnote); if(!zz) return;
    zz.revisionNote=t.value; dbSaveZone(zz); return;
  }
  if(t.dataset.tblRename!==undefined){
    const zz=Z.find(x=>x.id===t.dataset.tblRename); if(!zz) return;
    const newName=t.value.trim(); if(!newName){ t.value=zz.name; return; }
    zz.name=newName; dbSaveZone(zz); render(); return;
  }
  if(t.dataset.tblReveffort!==undefined){
    const zz=Z.find(x=>x.id===t.dataset.tblReveffort); if(!zz) return;
    zz.revEffort=Math.max(0.0625, Math.round((+t.value||0.0625)*16)/16); dbSaveZone(zz); S=build(); render(); return;
  }
  if(t.dataset.tblEffort!==undefined){
    const zz=Z.find(x=>x.id===t.dataset.tblEffort); if(!zz) return;
    zz.effort=Math.max(0.5, Math.round((+t.value||0.5)*2)/2); dbSaveZone(zz); S=build(); render(); return;
  }
  if(t.dataset.tblAssign!==undefined){
    const zz=Z.find(x=>x.id===t.dataset.tblAssign); if(!zz) return;
    zz.a=t.value||null; if(!zz.a) zz.outsource=null; else if(isFreelance(zz.a) && !zz.outsource) zz.outsource={cost:0};
    dbSaveZone(zz); S=build(); render(); return;
  }
  if(t.dataset.tblStatus!==undefined){
    const zz=Z.find(x=>x.id===t.dataset.tblStatus); if(!zz) return;
    zz.status=t.value; if(zz.status==='paused' && !zz.reason) zz.reason=REASONS[0];
    dbSaveZone(zz); S=build(); render(); return;
  }
  if(t.id==='projStart'){
    const newDate = t.value; if(!newDate) return;
    const p = proj(state.project);
    const before = scheduleFinishSnapshot();
    const zs = Z.filter(z=>z.p===p.id);
    zs.forEach(z=>{ z.earliest=newDate; dbSaveZone(z); });
    S=build();
    const after = scheduleFinishSnapshot();
    const delays = [];
    Object.keys(after).forEach(key=>{
      const [pid, projId] = key.split('|');
      if(projId===p.id) return; // очікувана, навмисна зміна — не issue
      const b=before[key], a=after[key];
      if(b && a && D(a)>D(b)) delays.push({person:pid, project:projId, before:b, after:a});
    });
    delays.forEach(d=>state.scheduleIssues.push({
      id:'iss'+Date.now()+Math.random().toString(36).slice(2,6),
      text:`Moving ${p.name}'s start to ${fmt(D(newDate))} pushed ${person(d.person).name}'s ${proj(d.project).name} finish from ${fmt(D(d.before))} to ${fmt(D(d.after))}.`,
    }));
    render();
    toast(`${p.name}: nothing starts before ${fmt(D(newDate))}${delays.length? ` · ${delays.length} knock-on delay${delays.length>1?'s':''} flagged`:''}`);
    return;
  }
  if(t.dataset.scopeReassign!==undefined){
    const [pid,disc,floor,name] = t.dataset.scopeReassign.split('|');
    const who = t.value || null;
    const fz = Z.filter(x=>x.p===pid && x.d===disc && x.floor===floor);
    const g = scopesOf(fz).find(x=>x.name===name); if(!g) return;
    g.zones.forEach(z=>{ z.a=who; if(!who) z.outsource=null; else if(isFreelance(who) && !z.outsource) z.outsource={cost:0}; dbSaveZone(z); });
    S=build(); render();
    toast(`${name} → ${who?person(who).name:'not assigned'} · ${g.zones.length} ${DISC[disc].unit}`); return;
  }
  if(z && t.dataset.assign!==undefined){ z.a=t.value||null; if(!z.a) z.outsource=null; else if(isFreelance(z.a) && !z.outsource) z.outsource={cost:0}; changed(`${z.name}: ${z.a?person(z.a).name:'not assigned'}`); return; }
  if(z && t.dataset.rename!==undefined){ const newName=t.value.trim(); if(!newName){ t.value=z.name; return; } z.name=newName; changed(`Renamed to ${z.name}`); return; }
  if(z && t.dataset.reason!==undefined){ z.reason=t.value; changed(`${z.name}: ${z.reason}`); return; }
  if(z && t.dataset.earliest!==undefined){ if(!t.value) return; z.earliest=t.value; changed(`${z.name}: nothing before ${fmt(D(z.earliest))}`); return; }
  if(z && t.dataset.v1delivered!==undefined){ z.v1Delivered=t.value||null; changed(z.v1Delivered?`First version marked delivered ${fmt(D(z.v1Delivered))}`:'First-version delivery date cleared'); return; }
  if(z && t.dataset.v1start!==undefined){ z.v1Start=t.value||null; changed(z.v1Start?`First version start set to ${fmt(D(z.v1Start))}`:'First-version start date cleared'); return; }
  if(z && t.dataset.revnote!==undefined){ z.revisionNote=t.value; dbSaveZone(z); render(); return; }
  if(z && t.dataset.outfee!==undefined){ if(!z.outsource) z.outsource={cost:0}; z.outsource.cost=Math.max(0,+t.value||0); changed(`${z.name}: outsourced · ${money(z.outsource.cost)}`); return; }
  if(t.dataset.teamName!==undefined){ const m=person(t.dataset.teamName); m.name=t.value.trim()||m.name; dbSaveTeam(m); render(); return; }
  if(t.dataset.teamRole!==undefined){ const m=person(t.dataset.teamRole); m.team=t.value; dbSaveTeam(m); S=build(); render(); return; }
  if(t.dataset.teamType!==undefined){ const m=person(t.dataset.teamType); m.type=t.value; if(m.type==='freelance') m.rate=0; dbSaveTeam(m); S=build(); render(); return; }
  if(t.dataset.rate!==undefined){ const m=person(t.dataset.rate); m.rate=Math.max(0,+t.value||0); dbSaveTeam(m); S=build(); render(); toast(`${m.name}: ${money(m.rate)}/month`); return; }
  if(t.dataset.calcbuf!==undefined){ state.calcBuffer=Math.max(1,+t.value||1); render(); return; }
  if(t.dataset.calc!==undefined){
    const c=CALC.find(x=>x.id===t.dataset.calc); if(!c) return;
    const f=t.dataset.f, i=t.dataset.i, p=t.dataset.p;
    if(f==='name'){ c.name=t.value; render(); return; }
    if(['budget','designRate','archRate','pmFee'].includes(f)){ c[f]=Math.max(0,+t.value||0); render(); return; }
    if(f==='ext'){ c.ext[p]=Math.max(0,+t.value||0); render(); return; }
    if(f==='currency'){ c.currency=t.value; render(); return; }
    if(f==='outsourceExt'){ c.outsourceExt.cost=Math.max(0,+t.value||0); render(); return; }
    if(f==='floorExec'){ c.floors[i].executor = t.value||null; render(); return; }
    if(f==='extExec'){ c.ext.executor = t.value||null; render(); return; }
    if(f==='archExec'){ c.archExecutor = t.value||null; render(); return; }
    if(f==='floors'||f==='dwgInt'||f==='dwgExt'){ c[f][i][p] = p==='name'? t.value : Math.max(0,+t.value||0); render(); return; }
  }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });

/* ---------- завантаження зі спільної бази; якщо недоступна — лишається демо-набір вище ---------- */
async function boot(){
  S = build(); render();               // демо-дані одразу, щоб екран не був порожнім
  if(!sb) return;
  try{
    const [team, proj, zones, pot, plans] = await Promise.all([
      sb.from('studio_team').select('*'),
      sb.from('studio_projects').select('*'),
      sb.from('studio_zones').select('*'),
      sb.from('studio_potentials').select('*'),
      sb.from('studio_floor_plans').select('*'),
    ]);
    if(team.error||proj.error||zones.error||pot.error) throw (team.error||proj.error||zones.error||pot.error);
    TEAM.length=0; TEAM.push(...team.data.map(r=>({id:r.id,name:r.name,team:r.team,color:r.color,rate:Number(r.rate),type:r.type||'staff'})));
    PROJECTS.length=0; PROJECTS.push(...proj.data.map(r=>({id:r.id,name:r.name,prio:r.prio,status:r.status,revenue:Number(r.revenue),currency:r.currency||'USD',payments:r.payments||[]})));
    Z.length=0; Z.push(...zones.data.map(fromDbZone));
    state.potentials.length=0; state.potentials.push(...pot.data.map(r=>({id:r.id,name:r.name,effort:Number(r.effort),team:r.team,revenue:Number(r.revenue),on:r.is_on})));
    FLOOR_PLANS.length=0;
    if(!plans.error) FLOOR_PLANS.push(...plans.data.map(r=>({id:r.id,p:r.project_id,floor:r.floor,imageUrl:r.image_url,area:r.area_sqm?Number(r.area_sqm):null,explication:r.explication||[]})));
    seq = Z.reduce((n,z)=>{ const m=/^z(\d+)$/.exec(z.id); return m? Math.max(n,+m[1]) : n; }, 0);
    S = build(); render();
    toast('Loaded from Production Plan (Supabase)');
  }catch(e){
    console.error('Supabase load failed, staying on local demo data', e);
    toast('Could not reach the database — showing local demo data');
  }
}
boot();
</script>
