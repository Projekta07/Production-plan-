<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARCHITEKTA — Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F0EC; --card:#FFFFFF; --line:#E6E3DD; --line-2:#EFEDE9;
  --ink:#1B1B1A; --ink-2:#55534F; --muted:#8B8883;
  --appr:#C9E4CF; --appr-t:#2F6B3F;
  --rev:#EDC9CD;  --rev-t:#8E4750;
  --pause:#F2DFB6;--pause-t:#7C5E1E;
  --inprog:#C8E6EC; --inprog-t:#1F6B7A;
  --ns:#EEECE8;   --ns-b:#C9C5BE;
  --viz:#EDC9CD;  --wd:#CBD9EC;
  --pot:#EEEAF7;  --pot-b:#B9AEE3; --pot-t:#5A4C9C;
  --ok:#C9E4CF; --ok-t:#2F6B3F; --warn:#F6DCCB; --warn-t:#9A4B22;
  --r:18px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413; --card:#1D1D1C; --line:#2C2C2A; --line-2:#252523;
  --ink:#F1EFEA; --ink-2:#BDBAB4; --muted:#8B8883;
  --ns:#262624; --ns-b:#4A4843; --pot:#26233A; --warn:#3A2A1F; --ok:#20352A;
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- shell ---------- */
.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{max-width:1320px;margin:0 auto;padding:20px 28px 16px}
.brand-row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.brand{font-size:15px;letter-spacing:.26em;font-weight:500}
.range{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:14px}
.range button{padding:3px 8px;border-radius:8px;color:var(--muted)}
.range button:hover{background:var(--line-2);color:var(--ink)}
.spacer{flex:1}
.tabs{display:flex;background:var(--line-2);border-radius:14px;padding:5px;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs button{padding:11px 14px;border-radius:10px;color:var(--muted);font-size:13px;white-space:nowrap;flex:none}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.main{max-width:1320px;margin:0 auto;padding:26px 28px 80px}
h1{font-size:34px;font-weight:500;letter-spacing:-.025em;margin:0}
.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}

.sel{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 38px 10px 16px;font-size:15px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.seg{display:inline-flex;background:var(--line-2);border-radius:11px;padding:4px;gap:2px}
.seg button{padding:7px 13px;border-radius:8px;color:var(--muted);font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.card-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 24px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:17px;font-weight:500;margin:0}
.card-h .hint{margin-left:auto;color:var(--muted);font-size:13px}
.card-b{padding:22px 24px}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .v{font-size:30px;font-weight:400;letter-spacing:-.02em;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .f{color:var(--muted);font-size:12px;margin-top:4px}
.kpi.warn .v{color:var(--warn-t)}

.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.stack{display:flex;flex-direction:column;gap:16px}

/* ---------- rooms by floor ---------- */
.floor{display:grid;grid-template-columns:96px minmax(0,1fr) 64px 22px;gap:14px;align-items:center;padding:12px 0}
.floor+.floor{border-top:1px solid var(--line-2)}
.floor .fn{font-size:15px}
.floor .fc{color:var(--muted);font-size:12.5px;margin-top:2px}
.floor .left{text-align:right;font-size:15px;white-space:nowrap}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{min-width:30px;height:30px;padding:0 5px;border-radius:9px;display:inline-grid;place-items:center;font-size:12px;
  font-variant-numeric:tabular-nums;border:1px solid transparent;transition:transform .1s}
.pill:hover{transform:translateY(-1px)}
.pill.approved{background:var(--appr);color:var(--appr-t)}
.pill.revision{background:var(--rev);color:var(--rev-t)}
.pill.paused{background:var(--pause);color:var(--pause-t)}
.pill.pending{background:var(--ns);border:1px dashed var(--ns-b);color:var(--ink-2)}
.pill.add{background:transparent;border:1px dashed var(--ns-b);color:var(--muted)}
.pill.sel{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--ink-2);font-size:13px;margin-top:16px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:4px;display:block}

/* ---------- donut ---------- */
.donut-wrap{display:grid;grid-template-columns:170px minmax(0,1fr);gap:22px;align-items:center}
.donut{width:170px;height:170px}
.donut text{font-family:inherit}
.dl{display:flex;flex-direction:column}
.dl .r{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line-2)}
.dl .r:last-child{border-bottom:0}
.dl .r i{width:10px;height:10px;border-radius:3px;display:block;transform:translateY(1px)}
.dl .r .n{color:var(--ink-2);font-size:13.5px}
.dl .r b{font-weight:500;font-size:13.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.dl .r .s{grid-column:2/4;color:var(--muted);font-size:12px;margin-top:-6px}

/* ---------- timelines ---------- */
.tl{--lab:150px}
.tl-head,.tl-row{display:grid;grid-template-columns:var(--lab) minmax(0,1fr);align-items:center}
.tl-head{color:var(--muted);font-size:12.5px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tl-weeks{display:flex}
.tl-weeks span{flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.tl-row{border-bottom:1px solid var(--line-2);min-height:54px}
.tl-row:last-child{border-bottom:0}
.tl-lab{padding:10px 12px 10px 0;font-size:15px;min-width:0}
.tl-lab small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.track{position:relative;height:100%;min-height:54px}
.track .gl{position:absolute;inset:0;display:flex;pointer-events:none}
.track .gl i{flex:1;border-left:1px solid var(--line-2)}
.today{position:absolute;top:4px;bottom:4px;border-left:1.5px dashed var(--ink-2);opacity:.45;pointer-events:none}
.bar{position:absolute;height:32px;border-radius:9px;display:flex;align-items:center;padding:0 11px;font-size:13px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);cursor:pointer}
.bar.ghost{background:transparent;color:var(--muted);cursor:default;padding-left:6px}
.bar.pot{background:var(--pot);border:1.5px dashed var(--pot-b);color:var(--pot-t)}
.bar.dim{opacity:.55}
.lanes{position:relative}

/* ---------- potential ---------- */
.form{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:14px;align-items:end}
.form label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}
.form input,.form select{width:100%;border:1px solid var(--line);background:var(--line-2);border-radius:12px;padding:12px 14px;font-size:15px}
.btn{background:var(--ink);color:var(--bg);padding:13px 22px;border-radius:12px;font-size:15px;font-weight:500;white-space:nowrap}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.banner{border-radius:14px;padding:15px 18px;font-size:15.5px;margin-top:16px}
.banner.ok{background:var(--ok);color:var(--ok-t)}
.banner.warn{background:var(--warn);color:var(--warn-t)}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.opt{border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;background:var(--card)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--line-2)}
.opt .t{font-size:13px;color:var(--muted)}
.opt .d{font-size:18px;margin-top:4px}
.opt .w{font-size:12.5px;color:var(--ink-2);margin-top:3px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,20,19,.3);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim[data-open="true"]{opacity:1;pointer-events:auto}
.drawer{position:fixed;right:0;top:0;bottom:0;width:390px;max-width:94vw;background:var(--card);z-index:41;border-left:1px solid var(--line);
  padding:26px 24px;overflow-y:auto;transform:translateX(100%);transition:transform .22s ease}
.drawer[data-open="true"]{transform:none}
.drawer h3{font-size:21px;font-weight:500;margin:4px 0 2px}
.drawer .x{position:absolute;right:16px;top:16px;font-size:20px;color:var(--muted);padding:4px 10px;border-radius:8px}
.drawer .x:hover{background:var(--line-2);color:var(--ink)}
.field{margin-top:20px}
.field .fl{color:var(--muted);font-size:12.5px;margin-bottom:8px}
.stbtns{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.stbtns button{padding:10px;border-radius:11px;border:1px solid var(--line);font-size:13.5px;text-align:left}
.stbtns button[aria-pressed="true"]{border-color:transparent}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.stepper button{padding:9px 15px;font-size:17px}
.stepper button:hover{background:var(--line-2)}
.stepper span{min-width:64px;text-align:center;font-size:15px;font-variant-numeric:tabular-nums}
.drawer select{width:100%;border:1px solid var(--line);background:var(--line-2);border-radius:11px;padding:10px 12px}
.note{background:var(--line-2);border-radius:12px;padding:13px 14px;font-size:13.5px;color:var(--ink-2);margin-top:20px;line-height:1.55}
.note b{color:var(--ink);font-weight:500}
.tl-lab{display:flex;flex-direction:column;gap:5px}
.mini-assign{align-self:flex-start;font-size:11px;padding:5px 9px;border:1px solid var(--line);border-radius:8px;color:var(--ink-2)}
.mini-assign:hover{background:var(--line-2);color:var(--ink)}
.mini-assign:disabled{opacity:.4;cursor:default}
.bar.sm{height:21px;font-size:11px;line-height:21px}
.bar.gap-note{background:transparent;border:1px dotted var(--pot-b);color:var(--pot-t);cursor:default}
.money{font-variant-numeric:tabular-nums}
.calc-title{font-size:19px;font-weight:500;border:1px solid transparent;background:transparent;border-radius:9px;padding:5px 8px;margin:-5px 0 -5px -8px;width:100%}
.calc-title:hover,.calc-title:focus{border-color:var(--line);background:var(--line-2)}
.calc-sec{margin-bottom:22px}
.calc-sec:last-child{margin-bottom:0}
.calc-sec-h{font-size:13px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.calc-sec-h .muted{text-transform:none;letter-spacing:0;font-weight:400;font-size:12.5px}
.calc-row{display:grid;grid-template-columns:1.1fr .55fr .65fr 1.05fr .6fr 26px;gap:8px;align-items:center;margin-bottom:6px}
.calc-row.head{color:var(--muted);font-size:11.5px;margin-bottom:8px}
.calc-row2{display:grid;grid-template-columns:1.4fr .9fr .7fr 26px;gap:8px;align-items:center;margin-bottom:6px}
.calc-row select,.calc-row2 select,.calc-exec select{border:1px solid var(--line);background:var(--line-2);border-radius:8px;padding:8px 9px;font-size:13px;width:100%}
.calc-exec{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.calc-exec span{color:var(--muted);font-size:12.5px;white-space:nowrap}
.badge-done{display:inline-flex;align-items:center;gap:6px;background:var(--appr);color:var(--appr-t);border-radius:20px;padding:5px 12px;font-size:12.5px}
.calc-row input,.calc-row2 input{border:1px solid var(--line);background:var(--line-2);border-radius:8px;padding:8px 9px;font-size:13.5px;width:100%}
.calc-row .num,.calc-row2 .num{text-align:right;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.rm{color:var(--muted);font-size:16px;line-height:1;padding:6px;border-radius:7px}
.rm:hover{background:var(--line-2);color:var(--warn-t)}
.add{color:var(--muted);font-size:12.5px;padding:7px 10px;border:1px dashed var(--line);border-radius:8px;margin-top:2px}
.add:hover{background:var(--line-2);color:var(--ink)}
.calc-out{display:flex;gap:8px;margin:8px 0}
.calc-out button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);font-size:13px}
.calc-out button[aria-pressed="true"]{border-color:transparent;background:var(--appr);color:var(--appr-t)}
.calc-fin-row{display:grid;grid-template-columns:1.4fr .8fr .8fr 1fr;gap:8px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13.5px;align-items:center}
.calc-fin-row:last-of-type{border-bottom:0}
.calc-fin-row .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.master-row{display:grid;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2);align-items:center;font-size:14px}
.master-row.head{color:var(--muted);font-size:11.5px;border-bottom:1px solid var(--line)}
.master-row.total{font-weight:600;border-top:2px solid var(--line);border-bottom:0;margin-top:4px;padding-top:12px}
.master-row.derived{color:var(--muted);font-size:13px}
.master-row .num{text-align:right;font-variant-numeric:tabular-nums}
.buf-input{width:46px;border:1px solid var(--line);background:var(--line-2);border-radius:7px;padding:3px 5px;font-size:12px;text-align:center}
.finrow{display:grid;grid-template-columns:1.3fr repeat(4,minmax(0,1fr));gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line-2)}
.finrow:last-child{border-bottom:0}
.finrow .nm{font-size:15px}
.finrow .sub{color:var(--muted);font-size:12px;margin-top:2px}
.finrow .num{text-align:right;font-variant-numeric:tabular-nums}
.fin-head{display:grid;grid-template-columns:1.3fr repeat(4,minmax(0,1fr));gap:10px;color:var(--muted);font-size:12px;padding-bottom:8px;border-bottom:1px solid var(--line);text-align:right}
.fin-head div:first-child{text-align:left}
.ratebox{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.ratebox:last-child{border-bottom:0}
.ratebox input{width:110px;text-align:right;border:1px solid var(--line);background:var(--line-2);border-radius:9px;padding:8px 10px}
.toggle{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line-2)}
.toggle:last-child{border-bottom:0}
.switch{width:38px;height:22px;border-radius:12px;background:var(--line-2);position:relative;flex:none;transition:.15s}
.switch i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.15s}
.switch[aria-pressed="true"]{background:var(--ink)}
.switch[aria-pressed="true"] i{left:18px}
.toggle .nm{font-size:15px}
.toggle .sub{color:var(--muted);font-size:12.5px}
.stack-chip{display:inline-flex;flex-direction:column;align-items:flex-end;gap:2px}
.stack-chip small{color:var(--muted);font-size:11px}
.row-key{display:flex;gap:16px;flex-wrap:wrap;color:var(--ink-2);font-size:12.5px;margin-top:14px}
.row-key span{display:inline-flex;align-items:center;gap:7px}
.row-key i{width:12px;height:12px;border-radius:4px;display:block}
.row-key i.dashed{background:transparent;border:1.5px dashed var(--pot-b)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;
  font-size:13.5px;z-index:60;opacity:0;pointer-events:none;transition:.2s;max-width:92vw}
.toast[data-show="true"]{opacity:1;transform:translate(-50%,0)}
.muted{color:var(--muted)}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:600;color:var(--ink);flex:none;border:2px solid var(--card);box-sizing:content-box}
.av.sm{width:21px;height:21px;font-size:9px}
.av.lg{width:34px;height:34px;font-size:12px;border-width:0}
.av-stack{display:flex;align-items:center;cursor:pointer}
.av-stack .av{margin-left:-8px}
.av-stack .av:first-child{margin-left:0}
.av-more{width:26px;height:26px;border-radius:50%;background:var(--line-2);color:var(--muted);display:inline-grid;place-items:center;font-size:10px;font-weight:600;margin-left:-8px;border:2px solid var(--card);box-sizing:content-box}
.floor-chev{width:22px;height:22px;display:grid;place-items:center;color:var(--muted);cursor:pointer;border-radius:6px;transition:transform .15s;flex:none}
.floor-chev:hover{background:var(--line-2);color:var(--ink)}
.floor-chev.open{transform:rotate(90deg)}
.scope-table{margin-top:14px;border-top:1px solid var(--line-2);padding-top:12px}
.scope-head,.scope-row{display:grid;grid-template-columns:1.2fr 1.5fr .85fr .55fr 1fr;gap:10px;align-items:center}
.scope-head{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;padding-bottom:8px;border-bottom:1px solid var(--line)}
.scope-row{padding:11px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.scope-row:hover{background:var(--line-2)}
.scope-row .sn{font-size:13.5px}
.scope-row .sd{color:var(--muted);font-size:11px;margin-top:1px}
.scope-row .rooms{display:flex;flex-wrap:wrap;gap:4px}
.scope-row .rooms span{font-size:10px;color:var(--muted);background:var(--line-2);border-radius:5px;padding:2px 5px}
.scope-row .status-chip{font-size:10.5px;padding:3px 9px;border-radius:20px;display:inline-block}
.effort-chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:9px}
.effort-chips .ec{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.tlm-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
.gantt-compact .tl-row{min-height:60px}
.gantt-compact .tl-lab{padding:9px 12px 9px 0;font-size:14.5px;line-height:1.35}
.gantt-compact .tl-lab small{font-size:12px;color:var(--muted)}
.gantt-compact .track{min-height:60px}
.gantt-compact .bar{height:30px;font-size:12px;padding:0 9px;font-weight:500}
.bar.two-line{height:38px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;line-height:1.35;gap:1px}
.bar.two-line .bt{font-size:12px;font-weight:600}
.bar.two-line .bs{font-size:10.5px;opacity:.85;font-weight:400}
.gantt-compact .floor-chev{width:22px;height:22px;font-size:13px}
.gantt-row.child{background:var(--card)}
.gantt-row+.gantt-row{border-top:1px solid var(--line-2)}
.gantt-compact .tl-row:hover{background:var(--line-2)}
.gantt-compact .tl-row.child:hover{background:var(--line-2)}

function toDbZone(z){
  return {
    id:z.id, project_id:z.p, discipline:z.d, floor:z.floor??null, n:z.n, name:z.name,
    effort:z.effort, rev_effort:z.revEffort??1, status:z.status, assignee_id:z.a??null,
    earliest:z.earliest, reason:z.reason??null, scope:z.scope??null,
    v1_delivered: z.v1Delivered??null, v1_start: z.v1Start??null, revision_note: z.revisionNote??null,
    outsource_cost: z.outsource? z.outsource.cost : null,
    after_project_id: z.after? z.after.p : null,
    after_floor: z.after? z.after.floor : null,
    after_lag: z.after? z.after.lag : null,
    updated_at: new Date().toISOString(),
  };
}
function fromDbZone(r){
  return {
    id:r.id, p:r.project_id, d:r.discipline, floor:r.floor, n:r.n, name:r.name,
    effort:Number(r.effort), revEffort:Number(r.rev_effort), status:r.status, a:r.assignee_id,

    outsource: r.outsource_cost!=null? {cost:Number(r.outsource_cost)} : undefined,
    after: r.after_project_id? {p:r.after_project_id, floor:r.after_floor, lag:r.after_lag} : undefined,
  };
}
async function dbSaveZone(z){ if(!sb||!z) return; const {error}=await sb.from('studio_zones').upsert(toDbZone(z)); if(error) toast('Not saved: '+error.message); }
async function dbSaveFloorPlan(fp){ if(!sb) return; const {error}=await sb.from('studio_floor_plans').upsert({id:fp.id, project_id:fp.p, floor:fp.floor, image_url:fp.imageUrl||null, area_sqm:fp.area||null, explication:fp.explication||[]}); if(error) toast('Not saved: '+error.message); }

/* завантажити файл планування в Storage і прив'язати до (проєкт, поверх) — не чіпає жодної реальної зони */
async function uploadFloorPlan(pid, floor, file){
  if(!sb){ toast('Not connected to the database'); return; }
  const ext = (file.name.split('.').pop()||'jpg').toLowerCase();
  const path = `${pid}/${floor.replace(/[^a-z0-9]+/gi,'-')}-${Date.now()}.${ext}`;
  const up = await sb.storage.from('floor-plans').upload(path, file, {upsert:true});
  if(up.error){ toast('Upload failed: '+up.error.message); return; }
  const { data: pub } = sb.storage.from('floor-plans').getPublicUrl(path);
  let fp = FLOOR_PLANS.find(x=>x.p===pid && x.floor===floor);
  if(!fp){ fp = {id:'fp-'+pid+'-'+Date.now(), p:pid, floor, explication:[]}; FLOOR_PLANS.push(fp); }
  fp.imageUrl = pub.publicUrl;
  await dbSaveFloorPlan(fp);
  render();
  toast(`${floor}: plan uploaded`);
}

function calcTotals(c){
  const designInt = c.floors.reduce((n,f)=>n+f.rooms*f.eff,0);
  const designExt = c.ext ? c.ext.zones*c.ext.eff : 0;
  const dwgIntTotal = c.dwgInt.reduce((n,x)=>n+x.eff,0);
  const dwgExtTotal = c.dwgExt.reduce((n,x)=>n+x.eff,0);
  const archTotal = dwgIntTotal+dwgExtTotal;
  const designTotal = designInt+designExt;
  const extCost = c.outsourceExt ? c.outsourceExt.cost : designExt*c.designRate;
  const expenses = designInt*c.designRate + extCost + archTotal*c.archRate + c.pmFee;
  const income = c.budget - expenses;
  return {designInt, designExt, designTotal, dwgIntTotal, dwgExtTotal, archTotal, extCost, expenses, income};
}

function active(z){
  if(z.outsource) return 0;                              // не займає внутрішній календар
  if(z.status==='approved' || z.status==='paused') return 0;
  if(z.status==='revision') return z.revEffort||1;
  return z.effort;
}
function floorOrder(f){ return ({'Ground':1,'1 floor':1,'First':2,'2 floor':2,'Second':3,'Exterior':4,'Hall':1,'AD':5,'LS':6})[f]||9 }
/* прикинутий кінець фази, коли її ще не поставлено в реальний розклад — суцільні робочі дні від старту */
function projectedEnd(start, duration){
  const total = Math.max(1, Math.ceil(duration));
  let d = new Date(start); while(!isWork(d)) d = addDays(d,1);
  let count = 1; while(count < total){ d = addDays(d,1); if(isWork(d)) count++; }
  return d;
}
/* 0.125d = 1 год (8-годинний день) — лише для показу; розклад усе одно бронює людині цілий календарний день */
function fmtEffortHM(d){
  if(d < 1){ const h=Math.round(d*8*4)/4; return (h%1===0?h:h.toFixed(2).replace(/0+$/,'').replace(/\.$/,''))+'h'; }
  if(Number.isInteger(d)) return d+'d';
  const days=Math.floor(d), hrs=Math.round((d-days)*8);
  return hrs? `${days}d ${hrs}h` : `${days}d`;
}

/* ---------- Scope: іменоване групування кімнат/пакетів на поверсі під одного виконавця ---------- */

/* стек аватарок: 1 людина — її ава; 2 — обидві; 3+ — перша (з найбільшим обсягом) + «+N» */
function avatarStack(people, cls){
  if(!people.length) return '<span class="muted" style="font-size:11.5px">unassigned</span>';
  if(people.length<=2) return `<span class="av-stack">${people.map(p=>avatar(p.id,cls)).join('')}</span>`;
  return `<span class="av-stack">${avatar(people[0].id,cls)}<span class="av-more">+${people.length-1}</span></span>`;

/* зони поверху, згруповані по scope-мітці; зона без мітки стає власним одиночним scope — існуючі проєкти не ламаються */
function scopesOf(floorZones){
  const map = new Map();
  floorZones.forEach(z=>{
    const key = z.scope || ('__'+z.id);
    if(!map.has(key)) map.set(key, {key, name: z.scope || z.name, zones:[]});
    map.get(key).zones.push(z);
  });
  return [...map.values()].map(g=>{
    g.zones.sort((a,b)=>a.n-b.n);
    const assignees = [...new Set(g.zones.map(z=>z.a).filter(Boolean))];
    const effort = g.zones.reduce((n,z)=>n+z.effort,0);
    const left = g.zones.reduce((n,z)=>n+active(z),0);
    const statuses = [...new Set(g.zones.map(z=>z.status))];
    g.assignees = assignees; g.effort = effort; g.left = left;
    g.status = statuses.length===1 ? statuses[0] : 'mixed';
    g.single = g.zones.length===1;
    return g;
  }).sort((a,b)=>a.zones[0].n-b.zones[0].n);
}
/* хто працює на поверсі і скільки — для стеку аватарок і швидкого попапу команди */
function floorTeam(floorZones){
  const by = new Map();
  floorZones.forEach(z=>{
    if(!z.a) return;
    if(!by.has(z.a)) by.set(z.a, {id:z.a, scopes:new Set(), effort:0, left:0});
    const e = by.get(z.a);
    e.scopes.add(z.scope || z.name); e.effort += z.effort; e.left += active(z);
  });
  return [...by.values()].sort((a,b)=>b.effort-a.effort);
}

let S;
function build(extra=[]){
  const items = [...Z, ...extra].map(z=>({...z, rem:active(z), days:[], fin:null}));
  const occ = {}; TEAM.forEach(m=>occ[m.id]=new Map());
  const floorDone = (p, floor) => {
    const g = items.filter(x=>x.p===p && x.d==='viz' && x.floor===floor && x.status!=='paused');
    if(g.some(x=>x.rem>0)) return null;
    const f = g.map(x=>x.fin).filter(Boolean);
    return f.length ? f.reduce((a,x)=>D(x)>D(a)?x:a) : iso(addDays(TODAY,-4));
  };
  const ready = (it, day) => {
    if(it.rem<=0 || D(it.earliest)>day) return false;
    if(proj(it.p).status!=='confirmed') return false;   // потенційний проєкт не займає реальний календар, доки не підтверджений
    if(!it.after) return true;
    const f = floorDone(it.after.p, it.after.floor);
    return f && addDays(D(f), it.after.lag) < day;
  };
  for(let k=0;k<260;k++){
    const day = addDays(TODAY,k);
    if(!isWork(day)) continue;
    const key = iso(day);
    TEAM.forEach(m=>{
      // один день = 1.0 "місткості" людини. Завдання на цілий день чи довше забирає її всю, як і раніше.
      // Коротша за день правка (rem<1) забирає лише свою частку — лишок місткості йде на наступну готову зону того самого дня.
      let capLeft = 1, guard = 0;
      const dayIds = [];
      while(capLeft > 1e-9 && guard++ < 50){
        const c = items.filter(x=>x.a===m.id && ready(x,day));
        if(!c.length) break;
        c.sort((a,b)=>(proj(a.p).prio-proj(b.p).prio) || (floorOrder(a.floor)-floorOrder(b.floor)) || (a.n-b.n));
        const it = c[0];
        const take = Math.min(capLeft, it.rem);
        it.rem -= take; capLeft -= take;
        it.days.push(key); dayIds.push(it.id);
        if(it.rem<=1e-9){ it.rem=0; it.fin = key; }
      }
      if(dayIds.length) occ[m.id].set(key, dayIds);
    });
  }
  items.forEach(x=>{ if(x.days.length){ x.s=x.days[0]; x.e=x.days[x.days.length-1]; } });
  return {items, occ, byId:new Map(items.map(x=>[x.id,x]))};
}
function recalc(){ S = build(); render(); }

function breakdown(list){

  const appr=by('approved'), rev=by('revision'), ip=by('inprogress'), pau=by('paused'), pen=by('pending');

  };
}
function finishOf(list){
  const e = list.map(z=>S.byId.get(z.id)).filter(x=>x&&x.e).map(x=>x.e);
  return e.length ? e.reduce((a,x)=>D(x)>D(a)?x:a) : null;

/* суцільні блоки роботи людини: один проєкт·дисципліна поспіль */
function blocksOf(id, extraOcc){
  const r = range(), out=[];
  let cur=null, d=new Date(r.start);
  while(d<=r.end){
    if(isWork(d)){
      const key=iso(d);
      const zids = S.occ[id].get(key);
      const z = zids&&zids.length ? S.byId.get(zids[0]) : (extraOcc && extraOcc.has(key) ? {p:'__pot', d:'pot', floor:''} : null);
      const tag = z ? z.p+'|'+z.d : null;
      if(tag && cur && cur.tag===tag){ cur.e=key; cur.days++; cur.floors[z.floor]=(cur.floors[z.floor]||0)+1; }
      else if(tag){ cur={tag, p:z.p, d:z.d, s:key, e:key, days:1, floors:{[z.floor]:1}}; out.push(cur); }
      else cur=null;
    }
    d=addDays(d,1);
  }
  // склеїти блоки одного проєкту, розділені лише вихідними
  const merged=[];
  out.forEach(b=>{
    const l=merged[merged.length-1];
    if(l && l.tag===b.tag && workdays(addDays(D(l.e),1), addDays(D(b.s),-1))===0){
      l.e=b.e; l.days+=b.days; Object.entries(b.floors).forEach(([f,n])=>l.floors[f]=(l.floors[f]||0)+n);
    } else merged.push(b);
  });
  return merged;
}
function freeFrom(id){
  let d=new Date(TODAY);
  for(let k=0;k<200;k++){
    if(isWork(d)){
      let busy=false, x=new Date(d);
      for(let j=0;j<5;j++){ while(!isWork(x)) x=addDays(x,1); if(S.occ[id].has(iso(x))){busy=true;break;} x=addDays(x,1); }
      if(!busy) return d;
    }
    d=addDays(d,1);
  }
  return null;
}
function remainingOf(id){ return S.items.filter(x=>x.a===id).reduce((n,x)=>n+active(x),0) }
/* усі невиконані дні, що належать ПІДТВЕРДЖЕНИМ проєктам — потенційні сюди не входять (правило 7) */
function remainingConfirmed(id){
  return Z.filter(z=>z.a===id && proj(z.p).status==='confirmed').reduce((n,z)=>n+active(z),0);
}
/* ЄДИНЕ джерело правди для Team Load — і матриця, і KPI зверху рахують саме звідси, щоб цифри сходились.
   available   — робочі дні періоду (поки відпустки/лікарняні не ведемо — це чесно позначено в підписі)
   scheduled   — скільки з цих днів рушій реально поставив у розклад людини В МЕЖАХ періоду (по проєктах)
   free        — available − scheduled, ніколи не може бути відʼємним (рушій не бронює два завдання на один день)
   overload    — scheduled − available; структурно завжди 0 у цьому рушії (один день = одне завдання),
                 лишаємо як окрему, чесно нульову колонку, а не ховаємо
   beyond      — залишок роботи, який не влазить у вікно періоду і піде далі в чергу */
function periodLoad(id, per){
  const available = workdays(new Date(Math.max(TODAY, per.start)), per.end);
  const byProject = {};
  let scheduled = 0;
  [...S.occ[id].keys()].forEach(k=>{
    if(D(k)<per.start || D(k)>per.end) return;
    const zids = S.occ[id].get(k) || [];
    let dayCounted = false;
    zids.forEach(zid=>{
      const it = S.byId.get(zid);
      if(!it || proj(it.p).status!=='confirmed') return;
      byProject[it.p] = (byProject[it.p]||0)+1;   // кожен дотик зони в цей день рахується в її проєкт
      if(!dayCounted){ scheduled++; dayCounted=true; } // сам календарний день рахується лише раз, навіть якщо його ділять кілька правок
    });
  });
  const totalRemaining = remainingConfirmed(id);
  return {
    available, scheduled, byProject,
    free: Math.max(0, available-scheduled),
    overload: Math.max(0, scheduled-available),
    beyond: Math.max(0, totalRemaining-scheduled),
  };
}

/* суцільні вільні проміжки людини від сьогодні */
function gapsOf(id){
  const out=[]; let cur=null, d=new Date(TODAY);
  for(let i=0;i<300;i++){
    if(isWork(d)){
      if(!S.occ[id].has(iso(d))){ if(cur) cur.e=new Date(d); else cur={s:new Date(d), e:new Date(d)}; }
      else if(cur){ out.push(cur); cur=null; }
    }
    d=addDays(d,1);
  }
  if(cur) out.push(cur);
  return out.map(g=>({...g, days:workdays(g.s,g.e)}));
}
/* розмістити effort одним суцільним блоком у першому вікні, що вміщає */
function continuousPlan(id, effort){
  const g = gapsOf(id).find(x=>x.days>=effort);
  if(!g) return null;
  const days=[]; let d=new Date(g.s), n=0;
  while(n<effort){ if(isWork(d)){ days.push(iso(d)); n++; } d=addDays(d,1); }
  return {days, start:days[0], finish:days[days.length-1], segs:[{s:days[0], e:days[days.length-1]}]};
}
/* розмістити effort у чергу вільних днів — заповнює прогалини, може розірватись */
function splitPlan(id, effort){
  const days = freeDays(id, TODAY, addDays(TODAY,300)).slice(0,effort).map(d=>iso(d));
  if(days.length<effort) return null;
  const segs=[]; let cur=null;
  days.forEach(k=>{
    if(cur && workdays(addDays(D(cur.e),1), addDays(D(k),-1))===0) cur.e=k;
    else { cur={s:k,e:k}; segs.push(cur); }
  });
  return {days, start:days[0], finish:days[days.length-1], segs};
}
function potBars(p){
  const out = p.segs.map(sg=>bar(sg.s, sg.e, {cls:'pot sm', top:30, text:`${workdays(D(sg.s),D(sg.e))}d`}));
  for(let i=1;i<p.segs.length;i++){
    const a=addDays(D(p.segs[i-1].e),1), b=addDays(D(p.segs[i].s),-1);
    if(a>b) continue;
    const pp=pct(iso(a),iso(b)); if(!pp) continue;
    out.push(`<div class="bar gap-note sm" style="left:${pp.left}%;width:calc(${pp.width}% - 3px);top:30px">resumes ${fmt(D(p.segs[i].s))}</div>`);
  }
  return out.join('');
}

/* ---------- симуляція потенційного проєкту ---------- */
function freeDays(id, from, to){
  const out=[]; let d=new Date(from);
  while(d<=to){ if(isWork(d) && !S.occ[id].has(iso(d))) out.push(new Date(d)); d=addDays(d,1); }
  return out;
}
function simulate(effort, ids){
  const pool=[];
  ids.forEach(id=>freeDays(id, TODAY, addDays(TODAY,300)).forEach(d=>pool.push({d,id})));
  pool.sort((a,b)=>a.d-b.d || ids.indexOf(a.id)-ids.indexOf(b.id));
  if(pool.length<effort || effort<=0) return null;
  const used=pool.slice(0,effort), by={};
  used.forEach(u=>(by[u.id]=by[u.id]||[]).push(iso(u.d)));
  return {start:iso(used[0].d), finish:iso(used[used.length-1].d), by, ids:Object.keys(by)};
}
function scenarios(effort, team){
  const ids = TEAM.filter(m=>m.team===team).map(m=>m.id);
  const all = simulate(effort, ids);
  let pair=null;
  for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++){
    const r=simulate(effort,[ids[i],ids[j]]); if(r && (!pair || D(r.finish)<D(pair.finish))) pair=r;
  }
  let one=null;
  ids.forEach(id=>{ const r=simulate(effort,[id]); if(r && (!one || D(r.finish)<D(one.finish))) one=r; });
  const list = [
    all  && {key:'all',  title:'Earliest · whole team', r:all},
    pair && {key:'pair', title:'Two people',            r:pair},
    one  && {key:'one',  title:'One person',            r:one},
  ].filter(Boolean);
  // однакові сценарії (коли вільні лише двоє) показуємо один раз
  const seen=new Set();
  return list.filter(o=>{ const k=o.r.ids.slice().sort().join('+')+o.r.finish; if(seen.has(k)) return false; seen.add(k); return true; });
}

function workdaysInMonth(y,m){ return workdays(new Date(y,m,1), new Date(y,m+1,0)) }

function ymLabel(k){ const [y,m]=k.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('en-GB',{month:'short',year:'2-digit'}) }

async function dbSaveTeam(m){ if(!sb) return; const {error}=await sb.from('studio_team').upsert({id:m.id,name:m.name,team:m.team,color:m.color,rate:m.rate||0,type:m.type||'staff'}); if(error) toast('Not saved: '+error.message); }
async function dbDeleteTeamMember(id){ if(!sb) return; const {error}=await sb.from('studio_team').delete().eq('id',id); if(error) toast('Not deleted: '+error.message); }
function uniqueTeamId(name){
  let base=(name.replace(/[^a-zA-Z]/g,'').slice(0,2)||'M').toUpperCase(), id=base, n=2;
  while(TEAM.some(m=>m.id===id)){ id=base+n; n++; }
  return id;
}

/* {ym: {inhouse, outsource, total, byPerson:[{id,days,cost}], byOutsource:[{name,cost}]}} по проєкту, з рушія Sx */
function monthlyCost(pid, Sx){
  Sx = Sx || S;
  const months = {};
  const touch = k => months[k] || (months[k]={inhouse:0, outsource:0, byPerson:{}, byOutsource:[]});
  Sx.items.filter(x=>x.p===pid && !x.outsource).forEach(it=>{
    (it.days||[]).forEach(day=>{
      const k=ym(day), mm=touch(k), c=dailyRate(it.a,k);
      mm.inhouse+=c;
      mm.byPerson[it.a]=(mm.byPerson[it.a]||0)+c;
    });
  });
  Z.filter(z=>z.p===pid && z.outsource).forEach(z=>{
    const k=ym(z.earliest), mm=touch(k);
    mm.outsource+=z.outsource.cost;
    mm.byOutsource.push({name:z.name, who:z.a, cost:z.outsource.cost});
  });
  Object.values(months).forEach(mm=>mm.total=mm.inhouse+mm.outsource);
  return months;
}
function projectCost(pid, Sx){
  const months = monthlyCost(pid, Sx);
  const scheduled = Object.values(months).reduce((n,m)=>n+m.total,0);
  // paused зони не мають днів у Sx (виключені з календаря) — рахуємо їх номінально, окремо
  const pausedNominal = Z.filter(z=>z.p===pid && z.status==='paused' && !z.outsource)
    .reduce((n,z)=>n+z.effort*nominalRate(z.a),0);
  return {scheduled, pausedNominal, total:scheduled+pausedNominal};
}
function projectFinance(pid, Sx){
  const p = proj(pid), cost = projectCost(pid, Sx), currency = p.currency||'USD';
  const costNative = usdToNative(cost.total, currency);
  const revenue = p.revenue||0;
  return {revenue, cost:costNative, costUSD:cost.total, currency, margin:revenue-costNative,
    coverage: revenue - costNative, ok: revenue>=costNative, breakdown:cost};
}
/* скільки коштує конкретна зона: факт (якщо заплановано), інакше оцінка */
function zoneCostEstimate(z, Sx){
  Sx = Sx || S;
  if(z.outsource) return z.outsource.cost;
  if(z.status==='approved') return 0;
  const it = Sx.byId.get(z.id);
  if(it && it.days && it.days.length) return it.days.reduce((n,day)=>n+dailyRate(it.a,ym(day)),0);
  if(!z.a) return 0;
  const eff = z.status==='revision' ? (z.revEffort||1) : z.effort;
  return eff * nominalRate(z.a);
}
function money(n, currency){
  currency = currency || 'USD';
  if(currency==='USD') return '$'+Math.round(n).toLocaleString('en-US');
  return currency+' '+Math.round(n).toLocaleString('en-US');
}
/* AED — довгостроково фіксований курс до долара (peg), лише для зведення різновалютних сум */
const FX = { AED: 3.6725 };
function usdToNative(amountUSD, currency){ return (currency && currency!=='USD') ? amountUSD*(FX[currency]||1) : amountUSD; }
function toUSD(amountNative, currency){ return (currency && currency!=='USD') ? amountNative/(FX[currency]||1) : amountNative; }

/* ======================================================================
   ТАЙМЛАЙН
   ====================================================================== */
function pct(a,b){
  const r=range(), total=(r.end-r.start)/864e5+1;
  const s=new Date(Math.max(D(a),r.start)), e=new Date(Math.min(D(b),r.end));
  if(e<s) return null;
  return {left:(s-r.start)/864e5/total*100, width:((e-s)/864e5+1)/total*100};
}
function tlHead(label){
  const r=range(), w=[];
  for(let i=0;i<r.weeks;i++) w.push(fmt(addDays(r.start,i*7)));
  return `<div class="tl-head"><div>${label}</div><div class="tl-weeks">${w.map(x=>`<span>${x}</span>`).join('')}</div></div>`;
}
function grid(){
  const r=range(), t=pct(iso(TODAY),iso(TODAY));
  return `<div class="gl">${Array.from({length:r.weeks},()=>'<i></i>').join('')}</div>${t?`<div class="today" style="left:${t.left}%"></div>`:''}`;
}
function bar(a,b,{cls='',bg='',text='',top=11,data='',title=''}={}){
  const p=pct(a,b); if(!p) return '';
  return `<div class="bar ${cls}" ${data} title="${esc(title||text)}" style="left:${p.left}%;width:calc(${p.width}% - 3px);top:${top}px;${bg?`background:${bg};`:''}">${text}</div>`;
}

/* ======================================================================
   PRODUCTION PLAN — справжній Гант одного проєкту, той самий розклад (S),
   що й усюди інде; місяці замість тижнів, бо проєкт триває довше за 10-тижневе вікно Studio Load
   ====================================================================== */
function spanOfZones(zones){
  const sched = zones.map(z=>S.byId.get(z.id)).filter(it=>it && it.s);
  if(!sched.length) return null;
  const starts = sched.map(x=>D(x.s)), ends = sched.map(x=>D(x.e));
  return {
    s: starts.reduce((a,x)=>x<a?x:a, starts[0]),
    e: ends.reduce((a,x)=>x>a?x:a, ends[0]),
  };
}
function ganttRange(projectId, discFilter, zoom){
  const zones = Z.filter(z=>z.p===projectId && (discFilter==='all'||z.d===discFilter));
  const sp = spanOfZones(zones);
  const start = sp ? new Date(Math.min(sp.s, TODAY)) : TODAY;
  const end = sp ? sp.e : addDays(TODAY,30);
  if(zoom==='month'){
    return {start:new Date(start.getFullYear(),start.getMonth(),1), end:new Date(end.getFullYear(),end.getMonth()+1,0)};
  }
  return {start:monday(start), end:addDays(monday(end),6)}; // day/week zoom share the same real span, just drawn finer
}
function ganttCols(r, zoom){
  const cols=[];
  if(zoom==='day'){
    let d=new Date(r.start);
    while(d<=r.end){ cols.push({label:String(d.getDate()), wk:!isWork(d), month:d.toLocaleDateString('en-GB',{month:'short',year:'numeric'})}); d=addDays(d,1); }
  } else if(zoom==='week'){
    let d=new Date(r.start);
    while(d<=r.end){ cols.push({label:fmt(d)}); d=addDays(d,7); }
  } else {
    let m=new Date(r.start.getFullYear(),r.start.getMonth(),1);
    while(m<=r.end){ cols.push({label:m.toLocaleDateString('en-GB',{month:'short',year:'numeric'})}); m=new Date(m.getFullYear(),m.getMonth()+1,1); }
  }
  return cols;
}
function ganttPct(a,b,r){
  const total=(r.end-r.start)/864e5+1;
  const s=new Date(Math.max(D(a),r.start)), e=new Date(Math.min(D(b),r.end));
  if(e<s) return null;
  return {left:(s-r.start)/864e5/total*100, width:((e-s)/864e5+1)/total*100};
}
function ganttBar(span,r,{cls='',bg='',text='',sub='',top=7,title='',ip=false}={}){
  if(!span) return '';
  const p=ganttPct(iso(span.s),iso(span.e),r); if(!p) return '';
  const dot = ip ? `<i style="width:6px;height:6px;border-radius:50%;background:var(--inprog-t);display:inline-block;margin-right:5px;flex:none"></i>` : '';
  const inner = sub ? `<span class="bt" style="display:flex;align-items:center">${dot}${esc(text)}</span><span class="bs">${esc(sub)}</span>` : `${dot}${esc(text)}`;
  return `<div class="bar sm ${sub?'two-line':''} ${cls}" title="${esc((ip?'In progress · ':'')+(title||text)+(sub?' · '+sub:''))}" style="left:${p.left}%;width:calc(${p.width}% - 2px);top:${top}px;${bg?`background:${bg};`:''}">${inner}</div>`;
}
function ganttGrid(r, cols){
  const t = ganttPct(iso(TODAY), iso(TODAY), r);
  return `<div class="gl">${cols.map(c=>`<i class="${c.wk?'wk':''}"></i>`).join('')}</div>${t?`<div class="today" style="left:${t.left}%"></div>`:''}`;
}
function ganttHead(cols){
  if(cols[0] && cols[0].month){
    const groups=[]; cols.forEach(c=>{ const last=groups[groups.length-1]; if(last&&last.label===c.month) last.n++; else groups.push({label:c.month,n:1}); });
    return `<div class="tl-head gantt-head" style="padding-bottom:0;border-bottom:0">
        <div></div><div class="tl-months">${groups.map(g=>`<span style="flex:${g.n} 0 0">${g.label}</span>`).join('')}</div></div>
      <div class="tl-head gantt-head" style="padding-top:3px">
        <div></div><div class="tl-weeks">${cols.map(c=>`<span class="${c.wk?'wk':''}">${c.label}</span>`).join('')}</div></div>`;
  }
  return `<div class="tl-head gantt-head"><div></div><div class="tl-weeks">${cols.map(c=>`<span>${c.label}</span>`).join('')}</div></div>`;
}
function barColorFor(team){ return team.length ? person(team[0].id).color : 'var(--ns)'; }
/* знімок "коли людина закінчує роботу на проєкті" — до і після зміни, щоб ловити побічні затримки */
function scheduleFinishSnapshot(){
  const map = {};
  TEAM.forEach(m=>{
    PROJECTS.filter(p=>p.status==='confirmed').forEach(p=>{
      const zs = Z.filter(z=>z.a===m.id && z.p===p.id && active(z)>0);
      if(!zs.length) return;
      const sp = spanOfZones(zs);
      if(sp) map[`${m.id}|${p.id}`] = iso(sp.e);
    });
  });
  return map;
}
function issuesBanner(){

  return `<section class="card" style="margin-bottom:16px;border-color:var(--warn-t)">
    <div class="card-h"><h2 style="color:var(--warn-t)">Scheduling issues</h2><span class="hint">surfaced by a recent start-date change — mark resolved once you've dealt with it</span></div>

        <button class="pill" data-issue-resolve="${i.id}">Resolved</button>

/* напис для рядка без розкладу — причина паузи, якщо вона є, замість голого "not scheduled" */
function groupStatusNote(zones){
  const paused = zones.filter(z=>z.status==='paused');
  if(!paused.length) return 'not scheduled';
  const reasons = [...new Set(paused.map(z=>z.reason).filter(Boolean))];
  return reasons.length===1 ? `Paused — ${reasons[0]}` : `Paused (${paused.length})`;
}
/* "In progress" — сьогодні потрапляє в реальний запланований діапазон групи */
function inProgressTag(span){ return span && D(iso(TODAY))>=span.s && D(iso(TODAY))<=span.e; }

/* сегменти календаря людини, що належать САМЕ цьому проєкту — не весь її графік, лише ця робота */
function projectBlocksOf(personId, projectId, r){
  const out=[]; let cur=null, d=new Date(r.start);
  while(d<=r.end){
    if(isWork(d)){
      const key=iso(d);
      const zids = S.occ[personId].get(key) || [];
      const onProject = zids.some(zid=>{ const z=S.byId.get(zid); return z && z.p===projectId; });
      if(onProject){ if(cur) cur.e=key; else { cur={s:key,e:key}; out.push(cur); } }
      else cur=null;
    }
    d=addDays(d,1);
  }
  return out.map(seg=>({s:D(seg.s), e:D(seg.e)}));
}
/* картка «Team on <project>» — та сама шкала/дисципліна, що й Гант вище, але загрузка лише по цьому проєкту */
function projectTeamCard(projectId, discFilter, r, cols, zoom){
  const pr = proj(projectId);
  const zones = Z.filter(z=>z.p===projectId && (discFilter==='all'||z.d===discFilter));
  const inRange = workdays(new Date(Math.max(TODAY,r.start)), r.end) || 1;
  const people = [...new Set(zones.map(z=>z.a).filter(Boolean))].map(id=>person(id))
    .sort((a,b)=> (b.team===a.team? 0 : a.team==='viz'?-1:1) || a.name.localeCompare(b.name));
  return `<section class="card gantt-compact" style="margin-top:16px">
    <div class="card-h"><h2>Team on ${esc(pr.name)}</h2><span class="hint">only this project's work — not the rest of their calendar</span></div>
    <div class="card-b" style="padding:0">
      <div class="tlm-wrap" style="border:0;border-radius:0"><div class="tl" style="--lab:160px;min-width:${Math.max(700,cols.length*(zoom==='day'?26:zoom==='week'?56:84))}px">
        ${ganttHead(cols)}
        ${people.length? people.map(m=>{
          const segs = projectBlocksOf(m.id, projectId, r);
          const busy = segs.reduce((n,s)=>n+workdays(s.s,s.e),0);
          const pct = Math.round(Math.min(100, busy/inRange*100));
          return `<div class="tl-row gantt-row"><div class="tl-lab" data-person-load="${m.id}" style="cursor:pointer">
              <div>${esc(m.name)}<span style="margin-left:6px;color:var(--muted);font-size:10.5px">${pct}%</span></div>
              <small>${ROLE_LABEL[m.team]||m.team}${m.type==='freelance'?' · freelance':''}</small></div>
            <div class="track">${ganttGrid(r,cols)}${segs.map(s=>ganttBar(s,r,{bg:m.color,text:workdays(s.s,s.e)+'d'})).join('')}</div></div>`;
        }).join('') : `<div class="muted" style="padding:16px 18px">No one assigned yet.</div>`}
      </div></div>
    </div>
  </section>`;
}

/* реюзабельна картка Ганта — викликається і зі своєї вкладки, і вбудовано знизу Project calculator */
function ganttSection(projectId, {embedded=false}={}){
  const pr = proj(projectId);
  const discFilter = state.ganttDisc, zoom = state.ganttZoom;
  const r = ganttRange(pr.id, discFilter, zoom);
  const cols = ganttCols(r, zoom);
  const discs = discFilter==='all' ? Object.keys(DISC).filter(d=>Z.some(z=>z.p===pr.id&&z.d===d)) : [discFilter];

  const rows = [];
  discs.forEach(d=>{
    const dz = Z.filter(z=>z.p===pr.id && z.d===d);
    if(!dz.length) return;
    const effort = dz.reduce((n,z)=>n+z.effort,0);
    rows.push({kind:'group', disc:d, label:DISC[d].name, effort, span:spanOfZones(dz)});
    const floors = [...new Set(dz.map(z=>z.floor))].sort((a,b)=>floorOrder(a)-floorOrder(b));
    floors.forEach(f=>{
      const fz = dz.filter(z=>z.floor===f);
      const fkey = `${pr.id}|${d}|${f}`;
      const team = floorTeam(fz);
      rows.push({kind:'floor', disc:d, floor:f, fkey, label:f, team, effort:fz.reduce((n,z)=>n+z.effort,0), span:spanOfZones(fz), zones:fz});
      if(state.ganttOpen[fkey]){
        scopesOf(fz).forEach(g=>{
          rows.push({kind:'scope', disc:d, floor:f, fkey, label:g.name, team:g.assignees.map(id=>({id})), effort:g.effort, span:spanOfZones(g.zones),
            single:g.single, zoneId:g.single?g.zones[0].id:null, zones:g.zones});
        });
      }
    });
  });

  return `<section class="card gantt-compact" style="${embedded?'margin-top:16px':''}">
    <div class="card-h">
      <h2>${embedded? 'Production plan' : 'Task / Scope'}</h2>
      <span class="hint">real dates from the team's schedule · click ▸ to reveal scopes</span>
      <div class="spacer"></div>
      <div class="seg">${['day','week','month'].map(z=>`<button data-gantt-zoom="${z}" aria-pressed="${zoom===z}">${z[0].toUpperCase()+z.slice(1)}</button>`).join('')}</div>
      <div class="seg">
        <button data-gantt-disc="all" aria-pressed="${discFilter==='all'}">All</button>
        ${Object.entries(DISC).map(([k,v])=>`<button data-gantt-disc="${k}" aria-pressed="${discFilter===k}">${v.short}</button>`).join('')}
      </div>
    </div>
    <div class="card-b" style="padding:0">
      <div class="tlm-wrap" style="border:0;border-radius:0"><div class="tl" style="--lab:230px;min-width:${Math.max(760,cols.length*(zoom==='day'?30:zoom==='week'?64:92))}px">
        ${ganttHead(cols)}
        ${rows.length? rows.map(row=>{
          if(row.kind==='group'){
            return `<div class="tl-row gantt-row" style="background:var(--line-2);border-bottom:1px solid var(--line)">
              <div class="tl-lab"><b style="font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)">${esc(row.label)}</b>
                <small>${row.effort}d${row.span?` · ${fmt(row.span.s)}–${fmt(row.span.e)}`:' · not scheduled'}</small></div>
              <div class="track">${ganttGrid(r,cols)}${ganttBar(row.span,r,{cls:'dim',bg:'var(--ink-2)',text:row.effort+'d',sub:row.span?`${fmt(row.span.s)} – ${fmt(row.span.e)}`:'',top:6})}</div></div>`;
          }
          if(row.kind==='floor'){
            const open = !!state.ganttOpen[row.fkey];
            return `<div class="tl-row gantt-row"><div class="tl-lab" style="display:flex;align-items:center;gap:6px">
                <button class="floor-chev ${open?'open':''}" data-gantt-toggle="${row.fkey}" aria-label="Expand ${esc(row.floor)}">▸</button>
                <div style="min-width:0;overflow:hidden"><div style="display:flex;align-items:center;gap:6px">${esc(row.label)}${avatarStack(row.team,'sm')}</div>
                  <small>${row.effort}d${row.span?` · ${fmt(row.span.s)}–${fmt(row.span.e)}`:''}</small></div>
              </div>
              <div class="track">${ganttGrid(r,cols)}${row.span? ganttBar(row.span,r,{bg:barColorFor(row.team), ip:inProgressTag(row.span), text:(row.team[0]?person(row.team[0].id).name+' · ':'')+row.effort+'d', sub:`${fmt(row.span.s)} – ${fmt(row.span.e)}`, top:6})
                : `<div class="muted" style="font-size:10.5px;padding:7px 0">${esc(groupStatusNote(row.zones))}</div>`}</div></div>`;
          }
          return `<div class="tl-row gantt-row child" style="cursor:pointer" ${row.single?`data-resched="${row.zoneId}"`:`data-scope-open="${row.fkey}|${esc(row.label)}"`}>
            <div class="tl-lab" style="padding-left:26px"><div style="display:flex;align-items:center;gap:6px">${esc(row.label)}${avatarStack(row.team,'sm')}</div>
              <small>${row.effort}d${row.span?` · ${fmt(row.span.s)}–${fmt(row.span.e)}`:''}</small></div>
            <div class="track">${ganttGrid(r,cols)}${row.span? ganttBar(row.span,r,{bg:barColorFor(row.team), ip:inProgressTag(row.span), text:row.effort+'d', sub:`${fmt(row.span.s)} – ${fmt(row.span.e)}`, top:6}) : `<div class="muted" style="font-size:10.5px;padding:7px 0">${esc(groupStatusNote(row.zones))}</div>`}</div></div>`;
        }).join('') : '<div class="muted" style="padding:20px 18px">No work in this discipline yet.</div>'}
      </div></div>
    </div>
  </section>
  ${projectTeamCard(pr.id, discFilter, r, cols, zoom)}`;
}

/* ---------- Усі проєкти разом: той самий Гант і той самий календар, просто з рівнем "проєкт" зверху ---------- */
function ganttSectionAll(){
  const discFilter = state.ganttDisc, zoom = state.ganttZoom;
  const confirmedProjects = PROJECTS.filter(p=>p.status==='confirmed' && Z.some(z=>z.p===p.id)).sort((a,b)=>a.prio-b.prio);

  const sp = spanOfZones(allZones);

  const end = sp? sp.e : addDays(TODAY,30);
  const r = zoom==='month'
    ? {start:new Date(start.getFullYear(),start.getMonth(),1), end:new Date(end.getFullYear(),end.getMonth()+1,0)}

  const cols = ganttCols(r, zoom);

  const rows = [];

    if(!state.ganttOpen[pkey]) return;

      const floors = [...new Set(dz.map(z=>z.floor))].sort((a,b)=>floorOrder(a)-floorOrder(b));
      floors.forEach(f=>{
        const fz = dz.filter(z=>z.floor===f);
        const fkey = `${pr.id}|${d}|${f}`;
        rows.push({kind:'floor', disc:d, floor:f, fkey, label:f, team:floorTeam(fz), effort:fz.reduce((n,z)=>n+z.effort,0), span:spanOfZones(fz), zones:fz});
        if(state.ganttOpen[fkey]){

function applyQuickSetup(pid, disc, floor, targetRooms, targetDays){
  const fz = Z.filter(z=>z.p===pid && z.d===disc && z.floor===floor).sort((a,b)=>a.n-b.n);
  const pending = fz.filter(z=>z.status==='pending');
  const nonPending = fz.length - pending.length;
  if(targetRooms < nonPending){ toast(`${floor} already has ${nonPending} ${DISC[disc].unit} with real progress — can't go below that`); targetRooms = nonPending; }
  pending.forEach(z=>{ z.effort=targetDays; dbSaveZone(z); });
  const diff = targetRooms - fz.length;
  if(diff>0){
    const startN = Math.max(0,...fz.map(z=>z.n))+1;
    const before = Z.length;
    for(let k=0;k<diff;k++){
      zone({p:pid, d:disc, floor, n:startN+k, name: disc==='viz'?'Room '+String(startN+k).padStart(2,'0'):'Package '+(startN+k),
        effort:targetDays, status:'pending', a:null});
    }
    Z.slice(before).forEach(dbSaveZone);
  } else if(diff<0){
    let toRemove = -diff;
    const removable = pending.slice().sort((a,b)=>b.n-a.n);
    const ids = new Set();
    for(const z of removable){ if(toRemove<=0) break; ids.add(z.id); toRemove--; }
    ids.forEach(id=>dbDeleteZone(id));
    Z = Z.filter(z=>!ids.has(z.id));
  }
  S=build(); render();
  toast(`${floor}: ${targetRooms} ${DISC[disc].unit} · ${targetDays}d each`);
}

function donut(b, dc){
  const seg=[['approved',b.appr],['revision',b.rev],['inprogress',b.ip],['paused',b.pau],['pending',b.pen]];
  const R=62, C=2*Math.PI*R, total=b.total||1;
  let off=0;
  const arcs = seg.map(([k,n])=>{
    const len=n/total*C, a=`<circle r="${R}" cx="85" cy="85" fill="none" stroke="${STATUS[k].col}" stroke-width="26"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 85 85)"/>`;
    off+=len; return a;
  }).join('');
  const row=(k,lab,n,w)=>`<div class="r"><i style="background:${STATUS[k].col}${k==='pending'?';border:1px dashed var(--ns-b)':''}"></i>
    <span class="n">${lab}</span><b>${n} ${n===1?dc.unit1:dc.unit}</b><span class="s">${w} days</span></div>`;
  return `<div class="donut-wrap">
    <svg class="donut" viewBox="0 0 170 170" role="img" aria-label="${b.appr} of ${b.total} approved">
      <circle r="${R}" cx="85" cy="85" fill="none" stroke="var(--line-2)" stroke-width="26"/>${arcs}
      <text x="85" y="92" text-anchor="middle" font-size="24" fill="var(--ink)">${b.appr} / ${b.total}</text>
    </svg>
    <div class="dl">
      ${row('approved','Approved',b.appr,b.apprW)}
      ${row('revision','Revision',b.rev,b.revW)}
      ${b.ip? row('inprogress','In progress',b.ip,b.ipW) : ''}
      ${row('paused','Paused',b.pau,b.pauW)}
      ${row('pending','Not started',b.pen,b.penW)}
      <div class="r"><i style="background:var(--ink)"></i><span class="n"><b>Remaining effort</b></span><b>${b.remaining} ${dc.unit}</b>
        <span class="s">${b.left} days to do${b.pauW?` · ${b.pauW} on hold`:''}</span></div>
    </div></div>`;
}

   ====================================================================== */
const PROJECT_PALETTE = ['#EDC9CD','#CBD9EC','#F1DDB5','#D3E2DA','#DCD5F0','#E7C9A9','#C9E4D8','#E3C9DE'];
const ROLE_LABEL = {viz:'Designer', wd:'Architect', pm:'Procurement Manager'};
/* один розрахунок на всю сторінку: і матриця, і KPI зверху читають ці самі числа — тому вони завжди сходяться */
function teamLoadData(per){
  const live = PROJECTS.filter(p=>p.status==='confirmed');
  const rows = TEAM.map(m=>({m, L:periodLoad(m.id, per)}));
  const usedProjectIds = new Set();
  rows.forEach(r=>Object.keys(r.L.byProject).forEach(pid=>usedProjectIds.add(pid)));
  const cols = live.filter(p=>usedProjectIds.has(p.id));
  const projColor = {}; live.forEach((p,i)=>projColor[p.id]=PROJECT_PALETTE[i%PROJECT_PALETTE.length]);
  const totals = {
    available: rows.reduce((n,r)=>n+r.L.available,0),
    scheduled: rows.reduce((n,r)=>n+r.L.scheduled,0),
    free: rows.reduce((n,r)=>n+r.L.free,0),
    overload: rows.reduce((n,r)=>n+r.L.overload,0),
    beyond: rows.reduce((n,r)=>n+r.L.beyond,0),
    byProject: {},
  };
  cols.forEach(p=>{ totals.byProject[p.id] = rows.reduce((n,r)=>n+(r.L.byProject[p.id]||0),0); });
  return {rows, cols, projColor, totals};
}
function studioProgressPanel(){
  const disc = state.studioDisc || 'viz', dc = DISC[disc];
  const zones = Z.filter(z=>z.d===disc && proj(z.p).status==='confirmed');
  const b = breakdown(zones);
  const rows = [...new Set(zones.map(z=>z.p))].map(pid=>proj(pid)).sort((a,b)=>a.prio-b.prio);
  return `<section class="card" style="margin-bottom:16px">
    <div class="card-h"><h2>Production progress — all projects</h2>
      <div class="seg">${Object.entries(DISC).map(([k,v])=>`<button data-studio-disc="${k}" aria-pressed="${disc===k}">${v.short==='3D'?'3D':'Drawings'}</button>`).join('')}</div>
      <span class="hint">confirmed projects only</span></div>
    <div class="card-b">
      <div class="grid2">
        <section class="card" style="box-shadow:none">
          <div class="card-h"><h2>${dc.unit[0].toUpperCase()+dc.unit.slice(1)} by project</h2><span class="hint">1 square = 1 ${dc.unit1} · tap to open</span></div>
          <div class="card-b">
            ${rows.map(p=>{
              const pz = zones.filter(z=>z.p===p.id).sort((a,b)=>floorOrder(a.floor)-floorOrder(b.floor) || a.n-b.n);
              const done = pz.filter(z=>z.status==='approved').length;
              const left = pz.reduce((n,z)=>n+active(z),0);
              return `<div class="floor">
                <div><div class="fn">${esc(p.name)}</div><div class="fc">${done} / ${pz.length} approved${pz.some(z=>z.outsource)?' · <span style="color:var(--pot-t)">outsourced</span>':''}</div></div>
                <div class="pills">${pz.map(z=>`<button class="pill ${z.status} ${state.selZone===z.id?'sel':''}" data-zone="${z.id}"
                    title="${esc(p.name)} · ${esc(z.name)} · ${STATUS[z.status].lab} · ${z.effort}d${z.a?' · '+person(z.a).name:''}">${disc==='viz'?String(z.n).padStart(2,'0'):esc(z.name)}</button>`).join('')}</div>
                <div class="left">${left? left+'d left' : '<span style="color:var(--appr-t)">done</span>'}</div>
              </div>`;
            }).join('') || `<div class="muted">No confirmed ${dc.name.toLowerCase()} work yet.</div>`}
            <div class="legend">
              <span><i style="background:var(--appr)"></i>Approved</span>
              <span><i style="background:var(--rev)"></i>Revision</span>
              <span><i style="background:var(--inprog)"></i>In progress</span>
              <span><i style="background:var(--pause)"></i>Paused</span>
              <span><i style="background:var(--ns);border:1px dashed var(--ns-b)"></i>Not started</span>
            </div>
          </div>
        </section>
        <section class="card" style="box-shadow:none">
          <div class="card-h"><h2>${dc.name} progress</h2><span class="hint">effort, not calendar</span></div>
          <div class="card-b">${donut(b, dc)}</div>
        </section>
      </div>
    </div>
  </section>`;
}

function teamLoadPanel(per){
  const TL = teamLoadData(per);
  const groups = [...new Set(TEAM.map(m=>m.team))];
  return `<section class="card" style="margin-bottom:16px">
    <div class="card-h"><h2>Team load</h2><span class="hint">${fmt(per.start)} – ${fmt(per.end)} · ${TL.rows[0]?TL.rows[0].L.available:0} working days per person · remaining effort scheduled in this period</span></div>
    <div class="card-b">
      <div class="tlm-wrap"><table class="tlm">
        <thead><tr>
          <th>Team member</th>
          ${TL.cols.map(p=>`<th><i class="dot" style="background:${TL.projColor[p.id]}"></i>${esc(p.name)}</th>`).join('')}
          <th>Total</th><th>Available</th><th>Free</th><th>Overload</th><th>Beyond period</th>
        </tr></thead>
        <tbody>
          ${groups.map(g=>{
            const members = TL.rows.filter(r=>r.m.team===g);
            if(!members.length) return '';
            return `<tr class="role-row"><td colspan="${TL.cols.length+6}">${ROLE_LABEL[g]||g}</td></tr>` +
              members.map(r=>{
                const total = TL.cols.reduce((n,p)=>n+(r.L.byProject[p.id]||0),0);
                return `<tr>
                  <td class="name-cell" data-person-load="${r.m.id}">${esc(r.m.name)}<span class="rl">${r.m.type==='freelance'?'Outsource':''}</span></td>
                  ${TL.cols.map(p=>{
                    const v=r.L.byProject[p.id]||0;
                    return v? `<td class="cell-btn" data-cell-load="${r.m.id}|${p.id}">${v} d</td>` : `<td class="cell-empty">—</td>`;
                  }).join('')}
                  <td>${total||'—'}</td>
                  <td class="muted">${r.L.available}</td>
                  <td>${r.L.free||'—'}</td>
                  <td class="${r.L.overload?'warn-cell':'cell-empty'}">${r.L.overload||'—'}</td>
                  <td class="${r.L.beyond?'warn-cell':'cell-empty'}">${r.L.beyond||'—'}</td>
                </tr>`;
              }).join('');
          }).join('')}
        </tbody>
        <tfoot><tr>
          <td>Studio total</td>
          ${TL.cols.map(p=>`<td>${TL.totals.byProject[p.id]||'—'} d</td>`).join('')}
          <td>${TL.totals.scheduled} d</td>
          <td>${TL.totals.available} d</td>
          <td>${TL.totals.free} d</td>
          <td class="${TL.totals.overload?'warn-cell':''}">${TL.totals.overload||'—'}</td>
          <td class="${TL.totals.beyond?'warn-cell':''}">${TL.totals.beyond||'—'} d</td>
        </tr></tfoot>
      </table></div>
      <div class="note" style="margin-top:14px">Choose a team member to see which stages make up their days.</div>
      <p class="muted" style="font-size:11.5px;margin-top:10px">Days are effort scheduled inside this period, not calendar dates — a project cell opens its stage and room detail. Available assumes a Mon–Fri week with no holidays or leave tracked yet. Overload would mean two things booked on the same day, which this scheduler never allows — so it reads 0 here; "Beyond period" is the honest signal for backlog that won't fit before ${fmt(per.end)}.</p>
    </div>
  </section>`;
}

function viewLoad(){
  const r = range();
  const live = Z.filter(z=>proj(z.p).status==='confirmed');
  const confirmed = live.reduce((n,z)=>n+active(z),0);
  const inRange = workdays(new Date(Math.max(TODAY,r.start)), r.end);
  const capacity = TEAM.length * inRange;
  const teamLoad = teamLoadData(r);            // одне джерело правди — і тут, і в самій матриці нижче
  const free = teamLoad.totals.free;           // сума ПОЗИТИВНОЇ вільності по кожній людині (правило 6), не нетто
  const slots = TEAM.map(m=>({m, d:freeFrom(m.id)})).filter(x=>x.d).sort((a,b)=>a.d-b.d);
  const beyond = teamLoad.rows.map(x=>({m:x.m, n:x.L.beyond})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);

  // рядки: проєкт · дисципліна
  const stages=[];
  PROJECTS.forEach(p=>Object.keys(DISC).forEach(d=>{
    const zs=Z.filter(z=>z.p===p.id&&z.d===d); if(!zs.length) return;
    stages.push({p, d, zs, b:breakdown(zs)});
  }));
  stages.sort((a,b)=>a.p.prio-b.p.prio || (a.d==='viz'?-1:1));

  return `
  <div class="head"><h1>Studio load · all projects</h1></div>
  ${issuesBanner()}
  <div class="kpis">
    <div class="kpi"><div class="l">Confirmed effort</div><div class="v">${confirmed} days</div><div class="f">left in confirmed projects</div></div>
    <div class="kpi"><div class="l">Capacity</div><div class="v">${capacity} days</div><div class="f">${TEAM.length} people · ${inRange} working days</div></div>
    <div class="kpi"><div class="l">Free capacity</div><div class="v">${free} days</div><div class="f">sum of each person's own free days, ${fmt(r.start)}–${fmt(r.end)}</div></div>
    <div class="kpi"><div class="l">First team slot</div><div class="v">${slots[0]?fmt(slots[0].d):'—'}</div><div class="f">${slots[0]?slots[0].m.name+' · a free week':'no free week'}</div></div>
    <div class="kpi ${beyond.length?'warn':''}"><div class="l">Beyond this period</div><div class="v">${beyond.length? beyond[0].m.name+' +'+beyond[0].n+'d':'No one'}</div>
      <div class="f">${beyond.length? 'backlog past '+fmt(r.end) : 'everything fits the window'}</div></div>
  </div>

  ${studioProgressPanel()}

  ${teamLoadPanel(r)}

  <section class="card" style="margin-bottom:16px">
    <div class="card-h"><h2>Projects × weeks</h2><span class="hint">one line = one project stage · bar = who and how many days</span></div>
    <div class="card-b tl" style="--lab:210px">
      ${tlHead('Project stage')}
      ${stages.map(st=>{
        const people=[...new Set(st.zs.map(z=>z.a).filter(Boolean))];
        const rows = people.map(id=>{
          const days = S.items.filter(x=>x.p===st.p.id&&x.d===st.d&&x.a===id).flatMap(x=>x.days).sort();
          return {id, days};
        }).filter(x=>x.days.length);
        const h = Math.max(1,rows.length)*42+12;
        return `<div class="tl-row" style="min-height:${h}px">
          <div class="tl-lab">${esc(st.p.name)} · ${DISC[st.d].short}<small>${st.b.remaining} ${DISC[st.d].unit} · ${st.b.left}d left${st.b.pau?` · ${st.b.pau} paused`:''}</small></div>
          <div class="track" style="min-height:${h}px">${grid()}
            ${rows.map((x,i)=>bar(x.days[0], x.days[x.days.length-1], {bg:person(x.id).color, top:10+i*42,
              text:`${person(x.id).name} · ${x.days.length}d`, data:`data-goto="${st.p.id}|${st.d}"`})).join('')}
            ${!rows.length? `<div class="bar ghost" style="left:0;top:11px">${st.b.left? 'no one assigned' : 'all approved'}</div>`:''}
          </div></div>`;
      }).join('')}
    </div>
  </section>

  <section class="card">
    <div class="card-h"><h2>Team capacity</h2><span class="hint">colour = project · empty = free</span></div>
    <div class="card-b tl">
      ${tlHead('Person')}
      ${TEAM.map(m=>{
        const bl=blocksOf(m.id), used=bl.reduce((n,x)=>n+x.days,0);
        return `<div class="tl-row"><div class="tl-lab">${m.name}<small>${DISC[m.team].role} · ${Math.round(used/inRange*100)}% loaded</small></div>
          <div class="track">${grid()}
            ${bl.map(x=>bar(x.s,x.e,{bg:(x.d==='viz'?'var(--viz)':'var(--wd)'), text:`${esc(proj(x.p).name)} · ${x.days}d`, data:`data-goto="${x.p}|${x.d}"`})).join('')}
          </div></div>`;
      }).join('')}
    </div>
  </section>`;
}

function viewPotential(){
  const sm = state.sim, r = range();
  const totalEffort = sm.floors.reduce((n,f)=>n+f.rooms*f.days,0);
  const opts = sm.ran ? scenarios(totalEffort, sm.team) : [];
  const pick = opts[Math.min(sm.pick, opts.length-1)];
  const beyond = pick && D(pick.r.finish) > r.end;
  const extraOcc = {};
  if(pick) Object.entries(pick.r.by).forEach(([id,days])=>extraOcc[id]=new Set(days));
  const people = TEAM.filter(m=>m.team===sm.team);
  const confEnd = people.map(m=>[...S.occ[m.id].keys()].sort().pop()).filter(Boolean).sort().pop();

  return `
  <div class="head"><h1>Potential project simulator</h1></div>
  <section class="card" style="margin-bottom:16px">
    <div class="card-h"><h2>Add project without changing the real plan</h2><span class="hint">same rooms-per-floor setup as Quick setup — the total effort is computed, not typed in</span></div>
    <div class="card-b">
      <div class="form">
        <div><label for="simName">Project</label><input id="simName" value="${esc(sm.name)}"></div>
        <div><label for="simTeam">Discipline</label><select id="simTeam">
          <option value="viz" ${sm.team==='viz'?'selected':''}>Designers</option>
          <option value="wd" ${sm.team==='wd'?'selected':''}>Architects</option></select></div>
      </div>

      <div style="margin-top:16px">
        ${sm.floors.map((f,i)=>`<div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2)">
          <input data-sim-floor-name="${i}" value="${esc(f.name)}" style="flex:1;min-width:110px;border:1px solid var(--line);background:var(--line-2);border-radius:7px;padding:6px 9px;font-size:13px">
          <label class="muted" style="font-size:11.5px;display:flex;align-items:center;gap:5px">Rooms<input type="number" min="1" value="${f.rooms}" data-sim-floor-rooms="${i}" style="width:52px;border:1px solid var(--line);background:var(--line-2);border-radius:7px;padding:5px 7px"></label>
          <label class="muted" style="font-size:11.5px;display:flex;align-items:center;gap:5px">Days/room<input type="number" min="0.5" step="0.5" value="${f.days}" data-sim-floor-days="${i}" style="width:52px;border:1px solid var(--line);background:var(--line-2);border-radius:7px;padding:5px 7px"></label>
          <span class="muted" style="font-size:12px;min-width:48px">${f.rooms*f.days}d</span>
          <button data-sim-floor-remove="${i}" style="border:0;background:none;color:var(--muted);font-size:16px;cursor:pointer">×</button>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
        <span style="font-size:14px">Total required effort: <b>${totalEffort}d</b></span>
        <button class="btn" data-simulate>Simulate</button>

      ${pick? `

        <div class="tl-row" style="border:0">
          <div class="tl-lab">Current work</div>
          <div class="track">${grid()}
            ${confEnd? bar(iso(TODAY), confEnd, {bg:'var(--viz)', text:'Confirmed studio load'}):''}
          </div></div>
        <div class="tl-row" style="border:0">
          <div class="tl-lab">Potential</div>
          <div class="track">${grid()}${bar(pick.r.start, pick.r.finish, {cls:'pot', text:`${esc(sm.name)} · ${totalEffort} ${DISC[sm.team].role.toLowerCase()}-days`})}</div></div>
      </div>
      <div class="opts">${opts.map((o,i)=>`<button class="opt" data-pick="${i}" aria-pressed="${o===pick}">
          <div class="t">${o.title}</div><div class="d">${fmt(D(o.r.start))} → ${fmt(D(o.r.finish))}</div>
          <div class="w">${o.r.ids.map(id=>person(id).name).join(' + ')} · ${workdays(D(o.r.start),D(o.r.finish))} working days</div></button>`).join('')}</div>
      <div class="banner ${beyond?'warn':'ok'}">
        Earliest start: ${fmt(D(pick.r.start))} · Forecast finish: ${fmt(D(pick.r.finish))} ·
        ${beyond? `Runs ${workdays(addDays(r.end,1), D(pick.r.finish))} working days past ${fmt(r.end)} — consider an extra ${DISC[sm.team].role.toLowerCase()}` : 'No additional hire required'}
      </div>
      <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">

}

/* ---------- Team calendar: по днях, для однієї людини, зібрано напряму з S (той самий розклад, що й усюди) ---------- */
function monthGridDays(y, mo){
  const start = monday(new Date(y, mo, 1));
  return Array.from({length:42}, (_,i)=>addDays(start,i));
}
/* один день людини може тепер містити кілька дотичних зон (коротші за день правки діляться днем) — завжди масив */
function dayTasksForPerson(personId, day){
  const occ = S.occ[personId]; if(!occ) return [];
  const key = iso(day), zids = occ.get(key); if(!zids || !zids.length) return [];
  return zids.map(zid=>{
    const z = Z.find(x=>x.id===zid), it = S.byId.get(zid);
    if(!z || !it) return null;
    return {z, idx: it.days.indexOf(key)+1, total: it.days.length};
  }).filter(Boolean);
}
function teamCalendarView(){
  const pid = state.teamCalPerson && person(state.teamCalPerson) ? state.teamCalPerson : TEAM[0].id;
  const off = state.teamCalMonthOffset||0;
  const base = new Date(TODAY.getFullYear(), TODAY.getMonth()+off, 1);
  const y=base.getFullYear(), mo=base.getMonth();
  const days = monthGridDays(y, mo);
  const monthLabel = base.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const dow = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const selDay = state.teamCalSelDay;
  const selTasks = selDay ? dayTasksForPerson(pid, D(selDay)) : [];
  return `
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px">
    <select id="teamCalPerson" class="sel">${TEAM.map(m=>`<option value="${m.id}" ${m.id===pid?'selected':''}>${esc(m.name)} · ${ROLE_LABEL[m.team]||m.team}</option>`).join('')}</select>
    <button class="pill" data-teamcal-shift="-1">‹</button>
    <span style="font-weight:500;min-width:140px">${monthLabel}</span>
    <button class="pill" data-teamcal-shift="1">›</button>
    <button class="pill" data-teamcal-shift="0">Today</button>
  </div>
  <div class="grid2" style="grid-template-columns:1fr 300px">
    <section class="card">
      <div class="card-b" style="padding:14px">
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px">
          ${dow.map(d=>`<div class="muted" style="font-size:10.5px;text-align:center">${d}</div>`).join('')}
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">
          ${days.map(d=>{
            const inMonth = d.getMonth()===mo;
            const tasks = dayTasksForPerson(pid, d);
            const isToday = iso(d)===iso(TODAY);
            const sel = selDay===iso(d);
            return `<div data-teamcal-day="${iso(d)}" style="min-height:${tasks.length>1?74+(tasks.length-1)*34:74}px;border-radius:10px;padding:6px;cursor:pointer;background:${sel?'var(--line-2)':'transparent'};border:1.5px solid ${isToday?'var(--ink-2)':'transparent'};opacity:${inMonth?1:.32}">
              <div style="font-size:11px;color:var(--muted);margin-bottom:4px">${d.getDate()}</div>
              ${tasks.map(task=>`<div style="background:${person(task.z.a).color};border-radius:7px;padding:5px 6px;line-height:1.3;margin-bottom:3px">
                  <div style="font-size:10.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(proj(task.z.p).name)}</div>
                  <div style="font-size:9px;color:var(--ink-2)">${DISC[task.z.d].short} · ${esc(task.z.scope||task.z.name)}</div>
                  ${task.z.status==='revision'? `<div style="font-size:9px;color:var(--rev-t);font-weight:600;margin-top:1px">Revision${task.z.revisionNote?': '+esc(task.z.revisionNote.slice(0,28))+(task.z.revisionNote.length>28?'…':''):''}</div>`
                    : `<div style="font-size:9px;color:var(--ink-2);margin-top:1px">${task.idx}/${task.total}d</div>`}
                </div>`).join('')}
            </div>`;
          }).join('')}
        </div>
      </div>
    </section>
    <section class="card">
      <div class="card-h"><h2>${selDay? fmt(D(selDay)) : 'Pick a day'}</h2>${selTasks.length>1?`<span class="hint">${selTasks.length} tasks this day</span>`:''}</div>
      <div class="card-b">

function viewFitFinder(){
  const c = state.cal, dc = DISC[c.team];
  const people = TEAM.filter(m=>m.team===c.team);
  const plans = {}; people.forEach(m=>{ plans[m.id] = c.mode==='block' ? continuousPlan(m.id,c.effort) : splitPlan(m.id,c.effort); });
  const ranked = people.map(m=>({m, p:plans[m.id]})).filter(x=>x.p).sort((a,b)=>D(a.p.finish)-D(b.p.finish));
  const best = ranked[0];

  return `
  <section class="card" style="margin-bottom:16px">
    <div class="card-h"><h2>Where does the next project fit?</h2><span class="hint">overlay a calculated effort onto real calendars, person by person</span></div>
    <div class="card-b">
      <div class="form">
        <div><label for="calName">Project name</label><input id="calName" value="${esc(c.name)}"></div>
        <div><label for="calEff">Required effort, days</label><input id="calEff" type="number" min="1" value="${c.effort}"></div>
        <div><label for="calTeam">Discipline</label><select id="calTeam">
          <option value="viz" ${c.team==='viz'?'selected':''}>Designers</option>
          <option value="wd" ${c.team==='wd'?'selected':''}>Architects</option></select></div>
        <button class="btn" data-calrun>Update</button>
      </div>

        <div class="seg">
          <button data-calmode="split" aria-pressed="${c.mode==='split'}">Fill gaps</button>
          <button data-calmode="block" aria-pressed="${c.mode==='block'}">One continuous block</button>
        </div>
        <span class="muted" style="font-size:12.5px">${c.mode==='split'? 'takes any free days in order — may pause for other work' : 'waits for one window big enough for the whole effort'}</span>
      </div>
      ${best? `<div class="banner ok" style="margin-top:16px">
        Fastest fit: <b>${best.m.name}</b> — finishes ${fmt(D(best.p.finish))}${best.p.segs.length>1? `, spread across ${best.p.segs.length} periods with breaks for other work` : ', one continuous run'}.
      </div>` : `<div class="banner warn" style="margin-top:16px">No one has ${c.effort} free ${c.mode==='block'?'days in a single window':'days'} within the next ~14 months.</div>`}
      <div class="row-key">
        <span><i style="background:var(--line-2)"></i>Confirmed work</span>
        <span><i class="dashed"></i>Potential — ${esc(c.name)}</span>
        <span><i style="background:transparent;border:1px dotted var(--pot-b)"></i>Break between periods</span>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-h"><h2>${dc.roles} — calendar with overlay</h2><span class="hint">top lane = confirmed · bottom lane = potential</span></div>
    <div class="card-b tl" style="--lab:168px">
      ${tlHead(dc.role)}
      ${people.map(m=>{
        const bl = blocksOf(m.id), p = plans[m.id];
        return `<div class="tl-row" style="min-height:64px">
          <div class="tl-lab">
            <div>${m.name}</div>
            <small>${p? (p.segs.length>1? `${p.segs.length} periods · finish ${fmt(D(p.finish))}` : `finish ${fmt(D(p.finish))}`) : 'not enough free time'}</small>
            <button class="mini-assign" data-assign-cal="${m.id}" ${p?'':'disabled'}>Assign here</button>
          </div>
          <div class="track" style="min-height:64px">${grid()}
            ${bl.map(x=>bar(x.s,x.e,{bg:m.color, cls:'dim sm', top:6, text:`${esc(proj(x.p).name)} · ${x.days}d`})).join('')}
            ${p? potBars(p) : `<div class="bar ghost sm" style="left:0;top:30px">no fit</div>`}
          </div></div>`;

}
